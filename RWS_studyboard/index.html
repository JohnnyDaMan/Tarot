<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWS 타로 마스터 스터디 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .transform-style-3d { transform-style: preserve-3d; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .perspective { perspective: 1500px; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .major-step-label { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
        .rank-meaning-badge { background: rgba(99, 102, 241, 0.1); color: #4f46e5; border: 1px solid rgba(99, 102, 241, 0.2); }
        
        /* Grid Column Definitions */
        .grid-cols-11 { grid-template-columns: repeat(11, minmax(0, 1fr)); }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                RefreshCw: <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0 0V2m0 6h-6m6 4a9 9 0 1 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16m0 0v6m0-6h6" />,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
                ZoomIn: <><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></>,
                X: <path d="M18 6 6 18M6 6l12 12" />,
                Sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 21l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>,
                Layers: <><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.1 6.34a1 1 0 0 0 0 1.82l9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16a1 1 0 0 0 0-1.82Z"/><path d="m2.1 14.15 9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16"/><path d="m2.1 10.15 9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16"/></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const IMG_BASE = "images/"; 
        const EXT = ".jpg"; 

        const MAJOR_CARDS = [
            { id: 'm-0', type: 'Major', num: 0, name: '0. 바보', element: '공기', desc: '무한한 가능성과 시작.', guide: '순수한 영혼의 여행이 시작되는 지점입니다.', img: `RWS (1)${EXT}` },
            { id: 'm-1', type: 'Major', num: 1, name: '1. 마법사', element: '수성', desc: '의지와 현실화 능력.', guide: '네 가지 원소를 다루는 창조적인 힘의 상징입니다.', img: `RWS (2)${EXT}` },
            { id: 'm-2', type: 'Major', num: 2, name: '2. 고위 여사제', element: '달', desc: '직관과 무의식의 지혜.', guide: '침묵 속에서 진실을 통찰하는 수호자입니다.', img: `RWS (3)${EXT}` },
            { id: 'm-3', type: 'Major', num: 3, name: '3. 여황제', element: '금성', desc: '풍요와 모성적 생명력.', guide: '물질적 비옥함과 즐거움의 정점입니다.', img: `RWS (4)${EXT}` },
            { id: 'm-4', type: 'Major', num: 4, name: '4. 황제', element: '양자리', desc: '질서와 권위의 구축.', guide: '현실적인 힘과 책임감을 보여주는 카드입니다.', img: `RWS (5)${EXT}` },
            { id: 'm-5', type: 'Major', num: 5, name: '5. 교황', element: '황소자리', desc: '전통과 사회적 규범.', guide: '믿음 체계와 가르침을 전달받는 단계입니다.', img: `RWS (6)${EXT}` },
            { id: 'm-6', type: 'Major', num: 6, name: '6. 연인', element: '쌍둥이자리', desc: '선택과 관계의 조화.', guide: '단순한 사랑을 넘어 삶의 가치관 선택을 의미합니다.', img: `RWS (7)${EXT}` },
            { id: 'm-7', type: 'Major', num: 7, name: '7. 전차', element: '게자리', desc: '승리와 통제된 의지.', guide: '강한 추진력으로 목표를 향해 나아가는 에너지입니다.', img: `RWS (8)${EXT}` },
            { id: 'm-8', type: 'Major', num: 8, name: '8. 힘', element: '사자자리', desc: '내면의 용기와 인내.', guide: '부드러운 통제로 야성을 길들이는 승리입니다.', img: `RWS (9)${EXT}` },
            { id: 'm-9', type: 'Major', num: 9, name: '9. 은둔자', element: '처녀자리', desc: '자기 성찰과 고독의 빛.', guide: '세상을 떠나 자신만의 진리를 구하는 단계입니다.', img: `RWS (10)${EXT}` },
            { id: 'm-10', type: 'Major', num: 10, name: '10. 운명의 수레바퀴', element: '목성', desc: '변화와 피할 수 없는 순환.', guide: '삶의 기복을 이해하고 흐름에 몸을 맡기는 지혜입니다.', img: `RWS (11)${EXT}` },
            { id: 'm-11', type: 'Major', num: 11, name: '11. 정의', element: '천칭자리', desc: '균형과 공정한 결과.', guide: '편견 없이 진실을 가려내는 도덕적 기준입니다.', img: `RWS (12)${EXT}` },
            { id: 'm-12', type: 'Major', num: 12, name: '12. 매달린 사람', element: '물', desc: '희생과 관점의 전환.', guide: '정지 상태에서 오는 영적인 자각입니다.', img: `RWS (13)${EXT}` },
            { id: 'm-13', type: 'Major', num: 13, name: '13. 죽음', element: '전갈자리', desc: '변형과 필연적인 종결.', guide: '새로운 시작을 위해 낡은 자아를 버리는 과정입니다.', img: `RWS (14)${EXT}` },
            { id: 'm-14', type: 'Major', num: 14, name: '14. 절제', element: '사수자리', desc: '조화와 연금술적 정화.', guide: '중용을 통해 에너지를 섞어 정제하는 단계입니다.', img: `RWS (15)${EXT}` },
            { id: 'm-15', type: 'Major', num: 15, name: '15. 악마', element: '염소자리', desc: '속박과 물질적 유혹.', guide: '스스로 가둔 심리적 감옥에서의 해방을 예고합니다.', img: `RWS (16)${EXT}` },
            { id: 'm-16', type: 'Major', num: 16, name: '16. 탑', element: '화성', desc: '갑작스런 붕괴와 정화.', guide: '거짓된 기반이 무너지는 충격적인 해방의 순간입니다.', img: `RWS (17)${EXT}` },
            { id: 'm-17', type: 'Major', num: 17, name: '17. 별', element: '물병자리', desc: '희망과 영적인 안식.', guide: '고난 뒤에 찾아오는 순수한 치유의 시간입니다.', img: `RWS (18)${EXT}` },
            { id: 'm-18', type: 'Major', num: 18, name: '18. 달', element: '물고기자리', desc: '환상과 내면의 공포.', guide: '무의식의 심연에서 진실을 찾는 여정입니다.', img: `RWS (19)${EXT}` },
            { id: 'm-19', type: 'Major', num: 19, name: '19. 태양', element: '태양', desc: '성공과 밝은 생명력.', guide: '어린아이 같은 순수한 기쁨과 성취의 상징입니다.', img: `RWS (20)${EXT}` },
            { id: 'm-20', type: 'Major', num: 20, name: '20. 심판', element: '불', desc: '부활과 결산, 소명.', guide: '지난 삶을 돌아보고 새로운 삶으로 도약하는 시간입니다.', img: `RWS (21)${EXT}` },
            { id: 'm-21', type: 'Major', num: 21, name: '21. 세계', element: '토성', desc: '완성과 완벽한 통합.', guide: '여정의 끝이자 조화로운 우주의 춤입니다.', img: `RWS (22)${EXT}` },
        ];

        const generatePipCards = () => {
            const suits = ['Wands', 'Cups', 'Swords', 'Pentacles'];
            const names = ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
            const labels = ['에이스', '2', '3', '4', '5', '6', '7', '8', '9', '10'];
            const numberMeanings = {
                'Ace': '슈트의 순수한 에너지이자 영혼의 선물', 'Two': '선택이나 균형을 찾는 시도',
                'Three': '원소의 에너지를 통해 꽃을 피우거나 창조함', 'Four': '구조와 안정성',
                'Five': '삶의 어려움과 갈등', 'Six': '우월한 자리에서의 관대함',
                'Seven': '행동하는 것과 도전', 'Eight': '움직임과 빠른 변화',
                'Nine': '강렬함과 정점', 'Ten': '과잉과 한계점'
            };
            const elements = { Wands: '불', Cups: '물', Swords: '공기', Pentacles: '흙' };
            const pips = [];
            let startIdx = 23;
            suits.forEach(suit => {
                names.forEach((name, idx) => {
                    pips.push({
                        id: `p-${suit}-${name}`,
                        type: 'Pip',
                        suit: suit,
                        rank: name,
                        name: `${suit === 'Wands' ? '완드' : suit === 'Cups' ? '컵' : suit === 'Swords' ? '소드' : '동전'} ${labels[idx]}`,
                        element: elements[suit],
                        numSymbol: numberMeanings[name],
                        desc: `${elements[suit]} 원소가 ${labels[idx]}번의 '${numberMeanings[name]}' 성질을 만난 상태입니다.`,
                        guide: `해당 원소가 일상적인 상황에서 어떻게 발현되는지 상징을 통해 관찰하세요.`,
                        img: `RWS (${startIdx++})${EXT}`
                    });
                });
            });
            return pips;
        };

        const PIP_CARDS = generatePipCards();

        const generateCourtCards = () => {
            const suits = ['Wands', 'Cups', 'Swords', 'Pentacles'];
            const ranks = ['Page', 'Knight', 'Queen', 'King'];
            const rankNames = { Page: '시종', Knight: '기사', Queen: '여왕', King: '왕' };
            const suitNames = { Wands: '완드', Cups: '컵', Swords: '소드', Pentacles: '동전' };
            const court = [];
            let startIdx = 63;
            suits.forEach(suit => {
                ranks.forEach(rank => {
                    court.push({
                        id: `c-${suit}-${rank}`,
                        type: 'Court',
                        suit: suit,
                        rank: rank,
                        name: `${suitNames[suit]} ${rankNames[rank]}`,
                        element: suit === 'Wands' ? '불' : suit === 'Cups' ? '물' : suit === 'Swords' ? '공기' : '흙',
                        desc: `인격화된 원소의 에너지. ${rankNames[rank]}의 사회적 위치와 기질을 가집니다.`,
                        guide: `해당 계급과 슈트 원소가 결합하여 나타나는 전형적인 성향의 인물상입니다.`,
                        img: `RWS (${startIdx++})${EXT}`
                    });
                });
            });
            return court;
        };

        const COURT_CARDS = generateCourtCards();

        const App = () => {
            const [activeTab, setActiveTab] = useState('Major'); 
            const [majorMode, setMajorMode] = useState('All'); 
            const [activeFilter, setActiveFilter] = useState({ type: 'suit', value: 'All' }); 
            const [zoomedCard, setZoomedCard] = useState(null);

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setActiveFilter({ type: 'suit', value: 'All' });
                setMajorMode('All');
                setZoomedCard(null);
            };

            const resetAll = () => { 
                setActiveFilter({ type: 'suit', value: 'All' }); 
                setMajorMode('All'); 
            };

            const filteredCards = activeTab === 'Major' ? MAJOR_CARDS : activeTab === 'Pip' ? PIP_CARDS : COURT_CARDS;
            const displayCards = activeFilter.value === 'All' ? filteredCards : filteredCards.filter(c => activeFilter.type === 'suit' ? c.suit === activeFilter.value : c.rank === activeFilter.value);

            const isFourCardMode = (activeTab === 'Court' && activeFilter.value !== 'All') || (activeTab === 'Pip' && activeFilter.type === 'rank' && activeFilter.value !== 'All');
            const isTenCardSuitMode = activeTab === 'Pip' && activeFilter.type === 'suit' && activeFilter.value !== 'All';

            const TarotCard = ({ card, customClass = "" }) => (
                <div key={card.id} onClick={() => setZoomedCard(card)} className={`group perspective h-full ${customClass}`}>
                    <div className="relative w-full aspect-[2/3.3] transition-all duration-700 transform-style-3d cursor-pointer card-shadow rounded-lg border-2 overflow-hidden shadow-sm bg-white hover:border-indigo-400 transition-colors">
                        <div className="absolute inset-0 flex flex-col items-center justify-center p-2 text-center opacity-10">
                            <div className="w-10 h-10 rounded-full border border-current flex items-center justify-center font-black text-sm">{card.name[0]}</div>
                        </div>
                        <img 
                            src={`${IMG_BASE}${card.img}`} 
                            alt={card.name} 
                            className="absolute inset-0 w-full h-full object-cover transition-opacity duration-300" 
                            loading="lazy" 
                            onError={(e) => { 
                                e.target.style.opacity = '0.3'; 
                                e.target.src = "https://via.placeholder.com/200x330?text=Card";
                            }} 
                            onLoad={(e) => { e.target.style.opacity = '1'; }} 
                        />
                        <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-1.5 z-10 text-white">
                            <div className={`font-black opacity-80 uppercase leading-none mb-0.5 ${(isFourCardMode || isTenCardSuitMode) ? 'text-[9px]' : 'text-[7px]'}`}>{card.type}</div>
                            <div className={`font-bold leading-tight line-clamp-1 ${(isFourCardMode || isTenCardSuitMode) ? 'text-sm' : 'text-[8px] sm:text-[9px]'}`}>{card.name}</div>
                        </div>
                    </div>
                </div>
            );

            const renderMajorTabContent = () => {
                if (majorMode === 'All') {
                    return (
                        <div className="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-11 gap-2 sm:gap-4 max-w-7xl mx-auto">
                            {MAJOR_CARDS.map(card => <TarotCard card={card} key={card.id} />)}
                        </div>
                    );
                }

                return (
                    <div className="space-y-12 max-w-7xl mx-auto pb-8">
                        <div className="flex justify-center mb-6">
                            <div className="w-24 sm:w-28 text-center">
                                <TarotCard card={MAJOR_CARDS[0]} />
                                <div className="mt-2 text-[10px] font-black text-indigo-500 uppercase tracking-tighter">여정의 시작 (0)</div>
                            </div>
                        </div>
                        {majorMode === 'Climax21' ? (
                            <>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-indigo-600"></span> 전반부 (1-10)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(1, 11).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-indigo-600"></span> 후반부 (11-20)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(11, 21).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="flex flex-col items-center border-t border-indigo-100 pt-8">
                                    <h3 className="text-sm font-black text-indigo-900 mb-4 uppercase tracking-widest text-center">클라이맥스 (21. 세계)</h3>
                                    <div className="w-32 sm:w-48"><TarotCard card={MAJOR_CARDS[21]} /></div>
                                </section>
                            </>
                        ) : majorMode === 'Pivot11' ? (
                            <>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase">첫 번째 절반 (1-10)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(1, 11).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="flex flex-col items-center py-6 bg-white rounded-3xl shadow-inner border border-slate-200">
                                    <h3 className="text-sm font-black text-indigo-900 mb-4 uppercase">중심축 (11. 정의)</h3>
                                    <div className="w-32 sm:w-40"><TarotCard card={MAJOR_CARDS[11]} /></div>
                                </section>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase text-right">두 번째 절반 (12-21)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(12, 22).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                            </>
                        ) : (
                            <>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">1단계: 사회화와 외적 성장 (1-7)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(1, 8).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">2단계: 내면의 변화와 성찰 (8-14)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(8, 15).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">3단계: 부활과 영적 해방 (15-21)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(15, 22).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                            </>
                        )}
                    </div>
                );
            };

            const gridClasses = isTenCardSuitMode
                ? "grid grid-cols-5 gap-2 sm:gap-3 max-w-5xl mx-auto px-4" 
                : isFourCardMode
                    ? "grid grid-cols-4 gap-2 sm:gap-4 max-w-7xl mx-auto" 
                    : activeTab === 'Pip' && activeFilter.value === 'All'
                        ? "grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-10 gap-2 max-w-7xl mx-auto"
                        : "grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-4 max-w-7xl mx-auto";

            return (
                <div className="flex flex-col h-screen bg-slate-100 font-sans text-slate-900 select-none overflow-hidden">
                    <header className="bg-white border-b px-4 py-3 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 bg-indigo-50 rounded-lg"><Icon name="Layers" className="text-indigo-600" size={20} /></div>
                                <h1 className="text-sm sm:text-lg font-black text-slate-800 tracking-tight uppercase">RWS Master</h1>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {['Major', 'Pip', 'Court'].map(tab => (
                                    <button key={tab} onClick={() => handleTabChange(tab)} className={`px-2 sm:px-4 py-1 rounded-md text-[10px] sm:text-xs font-bold transition ${activeTab === tab ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {tab === 'Major' ? '메이저' : tab === 'Pip' ? '핍 카드' : '궁정'}
                                    </button>
                                ))}
                            </div>
                            <button onClick={resetAll} className="p-1.5 bg-red-50 text-red-500 rounded-lg active:bg-red-100 transition shadow-sm" title="초기화"><Icon name="RefreshCw" size={16} /></button>
                        </div>
                        <div className="max-w-7xl mx-auto mt-3 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                            {activeTab === 'Major' ? (
                                <div className="flex gap-2 items-center bg-slate-50 p-1 rounded-full">
                                    <button onClick={() => setMajorMode('All')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'All' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>전체</button>
                                    <button onClick={() => setMajorMode('Climax21')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Climax21' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>21번 클라이맥스</button>
                                    <button onClick={() => setMajorMode('Pivot11')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Pivot11' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>11번 중심축</button>
                                    <button onClick={() => setMajorMode('Author7x3')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Author7x3' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>7x3 여정</button>
                                </div>
                            ) : (
                                <>
                                    <button onClick={() => setActiveFilter({ type: 'suit', value: 'All' })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.value === 'All' ? 'bg-slate-800 border-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>전체</button>
                                    <div className="flex gap-2 items-center border-l pl-2 border-slate-200">
                                        {['Wands', 'Cups', 'Swords', 'Pentacles'].map(suit => (
                                            <button key={suit} onClick={() => setActiveFilter({ type: 'suit', value: suit })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition flex items-center gap-1.5 ${activeFilter.type === 'suit' && activeFilter.value === suit ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>
                                                <span className={`w-1.5 h-1.5 rounded-full ${suit === 'Wands' ? 'bg-orange-400' : suit === 'Cups' ? 'bg-blue-400' : suit === 'Swords' ? 'bg-slate-400' : 'bg-green-400'}`}></span>
                                                {suit === 'Wands' ? '완드' : suit === 'Cups' ? '컵' : suit === 'Swords' ? '소드' : '동전'}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 items-center border-l pl-2 border-slate-200 overflow-x-auto no-scrollbar">
                                        {activeTab === 'Pip' ? ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'].map((rank, i) => (
                                            <button key={rank} onClick={() => setActiveFilter({ type: 'rank', value: rank })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.type === 'rank' && activeFilter.value === rank ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>{i === 0 ? 'Ace' : i + 1}</button>
                                        )) : ['Page', 'Knight', 'Queen', 'King'].map(rank => (
                                            <button key={rank} onClick={() => setActiveFilter({ type: 'rank', value: rank })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.type === 'rank' && activeFilter.value === rank ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>{rank === 'Page' ? '시종' : rank === 'Knight' ? '기사' : rank === 'Queen' ? '여왕' : '왕'}</button>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 p-4 overflow-y-auto">
                        <div className={activeTab === 'Major' ? "" : gridClasses}>
                            {activeTab === 'Major' ? renderMajorTabContent() : (
                                displayCards.map(card => (
                                    <div key={card.id} className={(isFourCardMode || isTenCardSuitMode) ? "flex flex-col h-full animate-in" : "h-full animate-in"}>
                                        <TarotCard card={card} customClass={(isFourCardMode || isTenCardSuitMode) ? "flex-1" : ""} />
                                        {(isFourCardMode || isTenCardSuitMode) && (
                                            <div className={`mt-2 p-2 rank-meaning-badge rounded-xl text-[8px] sm:text-[10px] font-black text-center leading-tight line-clamp-2 ${isTenCardSuitMode ? 'opacity-80' : ''}`}>
                                                {activeTab === 'Pip' ? (isTenCardSuitMode ? `${card.rank} 단계` : card.numSymbol) : card.element}
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    </main>

                    {zoomedCard && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center z-50 p-4" onClick={() => setZoomedCard(null)}>
                            <div className="relative flex flex-col md:flex-row bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden animate-in" onClick={e => e.stopPropagation()}>
                                <div className="md:w-1/2 flex items-center justify-center border-b md:border-b-0 md:border-r p-4 bg-slate-50">
                                    <img 
                                        src={`${IMG_BASE}${zoomedCard.img}`} 
                                        alt={zoomedCard.name} 
                                        className="max-h-[45vh] md:max-h-full w-full object-contain rounded-xl shadow-lg" 
                                        onError={(e) => { e.target.src = "https://via.placeholder.com/400x660?text=Card+Image"; }} 
                                    />
                                </div>
                                <div className="md:w-1/2 p-6 sm:p-8 flex flex-col justify-between overflow-y-auto">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-indigo-100 text-indigo-700">{zoomedCard.type}</span>
                                            <button onClick={() => setZoomedCard(null)} className="p-1 hover:bg-slate-100 rounded-full transition text-slate-400"><Icon name="X" size={24} /></button>
                                        </div>
                                        <h2 className="text-3xl sm:text-4xl font-black tracking-tighter mb-6 text-slate-800">{zoomedCard.name}</h2>
                                        <div className="space-y-4">
                                            <section className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                <div className="text-slate-500 font-black text-[10px] uppercase mb-1">핵심 상징</div>
                                                <p className="text-slate-800 text-base sm:text-lg font-bold leading-relaxed">{zoomedCard.desc}</p>
                                            </section>
                                            <section className="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                                                <div className="text-indigo-600 font-black text-[10px] uppercase mb-1">상징 통찰</div>
                                                <p className="text-indigo-900 text-xs sm:text-sm font-medium leading-relaxed">{zoomedCard.guide}</p>
                                            </section>
                                        </div>
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-slate-100 text-[9px] font-bold text-slate-400 italic text-center uppercase tracking-widest">
                                        RWS Master Study Guide
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
