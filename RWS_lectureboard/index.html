<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWS 타로 마스터 스터디 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .transform-style-3d { transform-style: preserve-3d; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .perspective { perspective: 1500px; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .major-step-label { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
        .rank-meaning-badge { background: rgba(99, 102, 241, 0.1); color: #4f46e5; border: 1px solid rgba(99, 102, 241, 0.2); }
        
        /* Grid Column Definitions */
        .grid-cols-11 { grid-template-columns: repeat(11, minmax(0, 1fr)); }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                RefreshCw: <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0 0V2m0 6h-6m6 4a9 9 0 1 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16m0 0v6m0-6h6" />,
                Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
                ZoomIn: <><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></>,
                X: <path d="M18 6 6 18M6 6l12 12" />,
                Sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 21l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>,
                Layers: <><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.1 6.34a1 1 0 0 0 0 1.82l9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16a1 1 0 0 0 0-1.82Z"/><path d="m2.1 14.15 9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16"/><path d="m2.1 10.15 9.07 4.16a2 2 0 0 0 1.66 0l9.07-4.16"/></>,
                ChevronLeft: <polyline points="15 18 9 12 15 6" />,
                ChevronRight: <polyline points="9 18 15 12 9 6" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const IMG_BASE = "images/"; 
        const EXT = ".jpg"; 

        const MAJOR_CARDS = [
            { id: 'm-0', type: 'Major', num: 0, name: '0. 바보', element: '공기', desc: '무한한 가능성과 시작.', guide: '순수한 영혼의 여행이 시작되는 지점입니다.', img: `RWS (1)${EXT}`, details: ['<b>벼랑 끝과 웃옷 주름:</b> 과거에 얽매이지 않는 무한한 가능성과 한계 없는 자유.', '<b>빛(햇빛)과 흰색 개:</b> 순결의 상징이자 평온하고 즐거운 상태.', '<b>막대기와 보따리, 주황색 깃털 모자:</b> 보따리는 가볍게 짊어진 인생 경험과 과거의 기억이며, 모자의 주황색 깃털은 열정적인 자유를 의미.', '<b>숫자 0:</b> 구속받지 않고 무한한 가능성을 가진 새로운 삶의 부화.'] },
            { id: 'm-1', type: 'Major', num: 1, name: '1. 마법사', element: '수성', desc: '의지와 현실화 능력.', guide: '네 가지 원소를 다루는 창조적인 힘의 상징입니다.', img: `RWS (2)${EXT}`, details: ['<b>빨간 장미와 흰 백합:</b> 열정(장미)과 순수함(백합).', '<b>무한대 사인과 뱀:</b> 끝이 없는 영원이 아니라, 우리가 경험하는 위대하고 특별한 삶의 순간.', '<b>수정 막대와 향한 손:</b> "하늘에서와 같이 땅에서도 그러하다"는 비전의 원리로, 신성한 에너지를 끌어내어 창조함.', '<b>네 가지 상징:</b> 불, 물, 공기, 흙이라는 삶의 4원소를 지휘하는 법을 배움.'] },
            { id: 'm-2', type: 'Major', num: 2, name: '2. 고위 여사제', element: '달', desc: '직관과 무의식의 지혜.', guide: '침묵 속에서 진실을 통찰하는 수호자입니다.', img: `RWS (3)${EXT}`, details: ["<b>'토라(Tora)' 두루마리:</b> 단어와 해석에 의해 달라지지 않는, 언어 너머의 깊은 진실과 율법.", '<b>두 기둥(B와 J)과 초승달:</b> 빛과 어둠처럼 반대의 씨앗을 품고 있는 양면성. 초승달은 여신이 발을 쉬게 하는 곳.', '<b>합쳐진 왕관:</b> 상현달, 하현달, 보름달의 결합으로 고대 여신(이시스)을 상징.', '<b>석류와 흐르는 물:</b> 석류는 생명의 원천이자 관능적 과일(영적인 천국)을 뜻하며, 물은 평화와 깊이를 상징.'] },
            { id: 'm-3', type: 'Major', num: 3, name: '3. 여황제', element: '금성', desc: '풍요와 모성적 생명력.', guide: '물질적 비옥함과 즐거움의 정점입니다.', img: `RWS (4)${EXT}`, details: ['<b>별 달린 왕관:</b> 12개의 별자리를 의미하며 그녀가 천국의 여왕임을 상징.', '<b>하트 모양 방패:</b> 멈추지 않는 사랑이자 열정의 지배자 (비너스의 상징).', '<b>밀과 폭포:</b> 밀은 헌신적인 대지의 여신(데메테르)과 식물을 뜻하고, 폭포는 넘쳐흐르는 열정과 애정.'] },
            { id: 'm-4', type: 'Major', num: 4, name: '4. 황제', element: '양자리', desc: '질서와 권위의 구축.', guide: '현실적인 힘과 책임감을 보여주는 카드입니다.', img: `RWS (5)${EXT}`, details: ['<b>메마른 산과 사막 위 왕좌:</b> 엄격하고 냉정하며 가혹해 보이는 아버지의 역할.', '<b>갑옷과 좁은 냇물:</b> 갑옷은 감정의 포옹을 막는 방어를 뜻하며, 냇물은 넘치던 감정을 통제하고 억누른 상태.'] },
            { id: 'm-5', type: 'Major', num: 5, name: '5. 교황', element: '황소자리', desc: '전통과 사회적 규범.', guide: '믿음 체계와 가르침을 전달받는 단계입니다.', img: `RWS (6)${EXT}`, details: ['<b>왕관과 두 명의 승려:</b> 권위에 복종하는 모습이자, 함께 지혜를 나누고 영적인 가르침을 전파함.', '<b>축복의 제스처:</b> "하늘에서와 같이 땅에서도 그러하다"는 의미로 각자의 삶이 우주의 일부로서 의미가 있음을 뜻함.'] },
            { id: 'm-6', type: 'Major', num: 6, name: '6. 연인', element: '쌍둥이자리', desc: '선택과 관계의 조화.', guide: '단순한 사랑을 넘어 삶의 가치관 선택을 의미합니다.', img: `RWS (7)${EXT}`, details: ['<b>아담과 이브, 두 나무:</b> 죄가 있거나 타락하지 않은 영혼의 결합을 이룬 이상적인 커플.', "<b>대천사 라파엘:</b> '신의 치유 능력'을 의미하며, 이성이 감정을 통과해 치유를 얻도록 축복함."] },
            { id: 'm-7', type: 'Major', num: 7, name: '7. 전차', element: '게자리', desc: '승리와 통제된 의지.', guide: '강한 추진력으로 목표를 향해 나아가는 에너지입니다.', img: `RWS (8)${EXT}`, details: ['<b>막대, 초승달, 별 달린 왕관:</b> 앞선 카드들(마법사, 고위 여사제, 여황제)의 상징이 합쳐져 삶의 다양성과 비극/희극의 모순을 나타냄.', '<b>캐노피, 수레, 도시:</b> 황제 카드의 법과 사회 구조, 그리고 물질세계를 상징.', '<b>흑백 스핑크스 두 마리:</b> 대비와 모순으로 이루어진 인생.', '<b>사각형과 링감/요니 상징:</b> 하얀 사각형은 물질을, 링감과 요니는 남성과 여성 에너지의 결합을 뜻함.'] },
            { id: 'm-8', type: 'Major', num: 8, name: '8. 힘', element: '사자자리', desc: '내면의 용기와 인내.', guide: '부드러운 통제로 야성을 길들이는 승리입니다.', img: `RWS (9)${EXT}`, details: ['<b>사자와 하얀 드레스:</b> 사자는 동물적 본능(욕망)을, 하얀 드레스는 부드럽게 그것을 길들이는 순수한 의도를 상징.', '<b>무한대 기호와 꽃 왕관:</b> 내면의 본능과 조화를 이루어 절대 고갈되지 않는 진실한 힘이며, 자연을 근간으로 함.', '<b>노란 하늘과 빨간 장미 벨트:</b> 노란 하늘은 정신 작용을, 장미는 욕망과 인간으로서의 의식을 의미.'] },
            { id: 'm-9', type: 'Major', num: 9, name: '9. 은둔자', element: '처녀자리', desc: '자기 성찰과 고독의 빛.', guide: '세상을 떠나 자신만의 진리를 구하는 단계입니다.', img: `RWS (10)${EXT}`, details: ['<b>망토와 산 정상:</b> 산 정상에 머무르며 내면의 진실한 빛으로 다른 이들의 길을 안내함.', '<b>등불과 육각의 별:</b> 지혜의 빛. 육각의 별은 남성적인 불과 생명을 잉태하는 자궁의 물이 결합한 형태.'] },
            { id: 'm-10', type: 'Major', num: 10, name: '10. 운명의 수레바퀴', element: '목성', desc: '변화와 피할 수 없는 순환.', guide: '삶의 기복을 이해하고 흐름에 몸을 맡기는 지혜입니다.', img: `RWS (11)${EXT}`, details: ['<b>네 개의 형상:</b> 네 개의 별자리(물병, 전갈, 사자, 황소)와 사계절, 그리고 마이너 아르카나의 4원소를 상징.', '<b>수레바퀴와 스핑크스:</b> 연금술적 변형을 거쳐야 하는 원소(수레바퀴)와 진실의 검을 든 스핑크스.', '<b>왼쪽의 뱀과 오른쪽의 아누비스:</b> 파괴와 죽음을 뜻하는 뱀(세스)과 영혼을 새로운 삶으로 안내하는 아누비스.', '<b>영단어와 히브리문자:</b> 가장 강력한 신의 이름(야훼)이자 창조의 공식.'] },
            { id: 'm-11', type: 'Major', num: 11, name: '11. 정의', element: '천칭자리', desc: '균형과 공정한 결과.', guide: '편견 없이 진실을 가려내는 도덕적 기준입니다.', img: `RWS (12)${EXT}`, details: ['<b>눈가리개를 하지 않은 여성:</b> 불공정함을 피하려 눈을 가리는 대신, 우리의 삶을 정직하고 똑바로 바라보는 능력.', '<b>똑바로 선 칼과 저울:</b> 진실을 향해 선 칼과 삶의 양면을 함께 다루어 공평함을 결정하는 저울.', '<b>장막 쳐진 기둥과 붉은 가운:</b> 2번 고위 여사제(기둥)와 1번 마법사(가운)의 특성이 합쳐져, 목표를 초월한 순수한 이성을 상징.'] },
            { id: 'm-12', type: 'Major', num: 12, name: '12. 매달린 사람', element: '물', desc: '희생과 관점의 전환.', guide: '정지 상태에서 오는 영적인 자각입니다.', img: `RWS (13)${EXT}`, details: ['<b>거꾸로 매달린 자세:</b> 앞선 정의를 받아들이면서 삶의 관점이 완전히 뒤집혔음을 의미.', '<b>접은 다리와 빛나는 얼굴:</b> 진실을 받아들이고 변화에 항복하는 균형(다리)과 다른 사람의 인정 없이도 영적으로 빛나는 표정.'] },
            { id: 'm-13', type: 'Major', num: 13, name: '13. 죽음', element: '전갈자리', desc: '변형과 필연적인 종결.', guide: '새로운 시작을 위해 낡은 자아를 버리는 과정입니다.', img: `RWS (14)${EXT}`, details: ['<b>갑옷 입은 백마 탄 해골:</b> 죽음이 모두에게 공평하다는 고전적 의미를 넘어, 더 복잡하고 미묘한 끝과 변화.', '<b>흰 장미 깃발:</b> 죽음의 힘과 순수함.', '<b>이집트인의 배:</b> 죽음이 완전한 끝이 아니라 한 상태에서 다른 상태로 이동하는 과정임을 상징.', '<b>네 사람:</b> 죽음과 변화를 마주했을 때 나타나는 인간의 여러 반응(견고한 저항, 두려움 없는 직면, 공포, 순수함과 해방).'] },
            { id: 'm-14', type: 'Major', num: 14, name: '14. 절제', element: '사수자리', desc: '조화와 연금술적 정화.', guide: '중용을 통해 에너지를 섞어 정제하는 단계입니다.', img: `RWS (15)${EXT}`, details: ['<b>천사 미카엘과 기울어진 컵/물:</b> 무언가를 포기한 뒤 발견하는 천사 같은 자아의 참모습(미카엘)이며, 컵과 물은 능력 밖의 일에서 침착해야 함을 의미.', '<b>사각형 속 히브리문자와 삼각형:</b> 신체(사각형) 안에 깃든 영혼(삼각형)과 내면의 유혹을 극복하는 진정한 승리.', '<b>바위와 물속에 둔 발:</b> 진짜 현실(바위)과 감정적인 것(물)이라는 상반된 에너지의 융합.', '<b>점 찍힌 원과 태양, 아이리스 꽃:</b> 새로운 삶과 더 높은 수준의 자각(태양)과 신을 향한 진지하고 엄숙한 맹세(아이리스).'] },
            { id: 'm-15', type: 'Major', num: 15, name: '15. 악마', element: '염소자리', desc: '속박과 물질적 유혹.', guide: '스스로 가둔 심리적 감옥에서의 해방을 예고합니다.', img: `RWS (16)${EXT}`, details: ['<b>느슨한 사슬:</b> 언제든 스스로 빠져나올 수 있는 상태로, 우리에게는 항상 선택의 자유가 있음을 상징.', '<b>바호메트와 꼬리:</b> 템플 기사단이 숭배한 악마이며, 꼬리는 학대하고 집착하는 나쁜 관계의 상징.', '<b>쫙 편 손과 맹렬한 토치:</b> 물질적인 세상은 눈에 보이는 그대로일 뿐이라는 의미(손)와 세속적 땅을 향하는 에너지(토치).'] },

            { id: 'm-17', type: 'Major', num: 17, name: '17. 별', element: '물병자리', desc: '희망과 영적인 안식.', guide: '고난 뒤에 찾아오는 순수한 치유의 시간입니다.', img: `RWS (18)${EXT}`, details: ['<b>옷 벗은 여성과 두 호리병:</b> 악마의 쇠사슬에서 벗어나 찾은 희망과 열린 마음. 호리병은 가뭄 뒤 땅에 생기를 불어넣는 치유와 재생의 의식.', '<b>물과 땅의 발, 8각의 별:</b> 물(무의식)과 땅을 관통하는 기적에 가까운 자세. 8각의 별은 방향을 알려주는 길잡이(북극성/금성)로 새로운 사랑과 태어남을 의미.'] },
            { id: 'm-18', type: 'Major', num: 18, name: '18. 달', element: '물고기자리', desc: '환상과 내면의 공포.', guide: '무의식의 심연에서 진실을 찾는 여정입니다.', img: `RWS (19)${EXT}`, details: ['<b>개와 늑대:</b> 환상과 광기를 다루는 반대되는 두 이미지로, 존재의 미스터리를 향한 마지막 시험.', '<b>가재와 어슴푸레한 달:</b> 가재는 공포와 본능에서 벗어나게 해주는 원초적인 뇌(무의식)를 상징하며, 달은 마음속 보물을 숨기고 있는 신비함.'] },
            { id: 'm-19', type: 'Major', num: 19, name: '19. 태양', element: '태양', desc: '성공과 밝은 생명력.', guide: '어린아이 같은 순수한 기쁨과 성취의 상징입니다.', img: `RWS (20)${EXT}`, details: ['<b>붉은색 깃털 달린 아이:</b> 바보 카드의 순수함으로 회귀하여 기쁨과 단순함을 드러내는 완벽한 자유의지.', '<b>얌전한 말과 담:</b> 동물적인 본능에 완벽히 순응함(말)과 자유를 위해 멀어지려는 의지(담).', '<b>광선과 파도, 승리의 깃발:</b> 11개의 광선과 10개의 파도가 합쳐져 21번 세계 카드의 완성을 은밀히 암시하며 영적 승리에 도달함.'] },

            { id: 'm-21', type: 'Major', num: 21, name: '21. 세계', element: '토성', desc: '완성과 완벽한 통합.', guide: '여정의 끝이자 조화로운 우주의 춤입니다.', img: `RWS (22)${EXT}`, details: ['<b>월계관 리스와 빨간 띠:</b> 바보 카드의 0 형태(시작과 끝이 연결됨)를 띠며, "하늘에서와 같이 땅에서도 그러하다"는 무한대를 완성함.', '<b>두 개의 막대:</b> 1번 마법사가 지닌 에너지를 양손으로 이어받아 과거와 미래의 여정을 연결.', '<b>네 개의 형상:</b> 10번 카드보다 더 우아하고 현실적으로 그려진 4계절과 4원소의 통합.'] },

        const COURT_CARDS = generateCourtCards();

        const App = () => {

            const [majorMode, setMajorMode] = useState('All'); 
            const [activeFilter, setActiveFilter] = useState({ type: 'suit', value: 'All' }); 
            const [zoomedCard, setZoomedCard] = useState(null);
            const [isFullScreen, setIsFullScreen] = useState(false);

            // 포인터(스와이프/드래그) 상태 관리
            const [pointerStartX, setPointerStartX] = useState(null);
            const [pointerCurrentX, setPointerCurrentX] = useState(null);

            const filteredCards = activeTab === 'Major' ? MAJOR_CARDS : activeTab === 'Pip' ? PIP_CARDS : COURT_CARDS;
            const displayCards = activeFilter.value === 'All' ? filteredCards : filteredCards.filter(c => activeFilter.type === 'suit' ? c.suit === activeFilter.value : c.rank === activeFilter.value);

            const closeDetail = () => {
                setZoomedCard(null);
                setIsFullScreen(false);
            };

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setActiveFilter({ type: 'suit', value: 'All' });
                setMajorMode('All');
                closeDetail();
            };

            const resetAll = () => { 
                setActiveFilter({ type: 'suit', value: 'All' }); 
                setMajorMode('All'); 
            };

            // 카드 이동(이전/다음) 로직
            const navigateCard = (direction) => {
                if (!zoomedCard || !displayCards.length) return;
                const currentIndex = displayCards.findIndex(c => c.id === zoomedCard.id);
                if (currentIndex === -1) return;

                let nextIndex;
                if (direction === 'next') {
                    nextIndex = currentIndex === displayCards.length - 1 ? 0 : currentIndex + 1;
                } else {
                    nextIndex = currentIndex === 0 ? displayCards.length - 1 : currentIndex - 1;
                }
                setZoomedCard(displayCards[nextIndex]);
            };

            // 스와이프 및 클릭 통합 처리 핸들러
            const handlePointerDown = (e) => {
                setPointerStartX(e.clientX);
                setPointerCurrentX(e.clientX);
            };

            const handlePointerMove = (e) => {
                if (pointerStartX !== null) {
                    setPointerCurrentX(e.clientX);
                }
            };

            const handlePointerUp = (e, clickHandler) => {
                if (pointerStartX === null) return;
                const distance = pointerStartX - pointerCurrentX;
                
                // 초기화 (다음 드래그를 위해)
                setPointerStartX(null);
                setPointerCurrentX(null);

                // 스와이프 판단 임계값 (50px)
                if (distance > 50) {
                    navigateCard('next');
                } else if (distance < -50) {
                    navigateCard('prev');
                } else {
                    // 드래그 거리가 짧으면 단순 클릭(터치)으로 간주
                    if (Math.abs(distance) < 10 && clickHandler) {
                        clickHandler();
                    }
                }
            };

            const handleNavBtnClick = (direction, e) => {
                e.stopPropagation();
                navigateCard(direction);
            };

            const isFourCardMode = (activeTab === 'Court' && activeFilter.value !== 'All') || (activeTab === 'Pip' && activeFilter.type === 'rank' && activeFilter.value !== 'All');
            const isTenCardSuitMode = activeTab === 'Pip' && activeFilter.type === 'suit' && activeFilter.value !== 'All';

            const TarotCard = ({ card, customClass = "" }) => (
                <div key={card.id} onClick={() => setZoomedCard(card)} className={`group perspective h-full ${customClass}`}>
                    <div className="relative w-full aspect-[2/3.3] transition-all duration-700 transform-style-3d cursor-pointer card-shadow rounded-lg border-2 overflow-hidden shadow-sm bg-white hover:border-indigo-400 transition-colors">

                            alt={card.name} 
                            className="absolute inset-0 w-full h-full object-cover transition-opacity duration-300"

                            onError={(e) => { 
                                e.target.style.opacity = '0.3'; 
                                e.target.src = "https://via.placeholder.com/200x330?text=Card";

                            onLoad={(e) => { e.target.style.opacity = '1'; }}

                            {MAJOR_CARDS.map(card => <TarotCard card={card} key={card.id} />)}
                        </div>
                    );
                }

                return (
                    <div className="space-y-12 max-w-7xl mx-auto pb-8">
                        <div className="flex justify-center mb-6">
                            <div className="w-24 sm:w-28 text-center">
                                <TarotCard card={MAJOR_CARDS[0]} />
                                <div className="mt-2 text-[10px] font-black text-indigo-500 uppercase tracking-tighter">여정의 시작 (0)</div>
                            </div>
                        </div>
                        {majorMode === 'Climax21' ? (
                            <>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-indigo-600"></span> 전반부 (1-10)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(1, 11).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-indigo-600"></span> 후반부 (11-20)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(11, 21).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="flex flex-col items-center border-t border-indigo-100 pt-8">
                                    <h3 className="text-sm font-black text-indigo-900 mb-4 uppercase tracking-widest text-center">클라이맥스 (21. 세계)</h3>
                                    <div className="w-32 sm:w-48"><TarotCard card={MAJOR_CARDS[21]} /></div>
                                </section>
                            </>
                        ) : majorMode === 'Pivot11' ? (
                            <>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase">첫 번째 절반 (1-10)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(1, 11).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="flex flex-col items-center py-6 bg-white rounded-3xl shadow-inner border border-slate-200">
                                    <h3 className="text-sm font-black text-indigo-900 mb-4 uppercase">중심축 (11. 정의)</h3>
                                    <div className="w-32 sm:w-40"><TarotCard card={MAJOR_CARDS[11]} /></div>
                                </section>
                                <section>
                                    <h3 className="text-xs font-black text-indigo-600 mb-4 uppercase text-right">두 번째 절반 (12-21)</h3>
                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">{MAJOR_CARDS.slice(12, 22).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                            </>
                        ) : (
                            <>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">1단계: 사회화와 외적 성장 (1-7)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(1, 8).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">2단계: 내면의 변화와 성찰 (8-14)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(8, 15).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                                <section className="space-y-3">
                                    <div className="major-step-label text-white px-4 py-2 rounded-xl text-[10px] sm:text-xs font-black shadow-lg">3단계: 부활과 영적 해방 (15-21)</div>
                                    <div className="grid grid-cols-7 gap-1 sm:gap-4">{MAJOR_CARDS.slice(15, 22).map(c => <TarotCard card={c} key={c.id} />)}</div>
                                </section>
                            </>
                        )}
                    </div>
                );
            };

            const gridClasses = isTenCardSuitMode
                ? "grid grid-cols-5 gap-2 sm:gap-3 max-w-5xl mx-auto px-4" 
                : isFourCardMode
                    ? "grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 lg:gap-6 max-w-sm sm:max-w-md md:max-w-xl lg:max-w-7xl mx-auto" 
                    : activeTab === 'Pip' && activeFilter.value === 'All'
                        ? "grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-10 gap-2 max-w-7xl mx-auto"
                        : "grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-4 max-w-7xl mx-auto";

            return (
                <div className="flex flex-col h-[100dvh] bg-slate-100 font-sans text-slate-900 select-none overflow-hidden">
                    <header className="bg-white border-b px-4 py-3 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 bg-indigo-50 rounded-lg"><Icon name="Layers" className="text-indigo-600" size={20} /></div>
                                <h1 className="text-sm sm:text-lg font-black text-slate-800 tracking-tight uppercase">RWS Master</h1>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {['Major', 'Pip', 'Court'].map(tab => (
                                    <button key={tab} onClick={() => handleTabChange(tab)} className={`px-2 sm:px-4 py-1 rounded-md text-[10px] sm:text-xs font-bold transition ${activeTab === tab ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {tab === 'Major' ? '메이저' : tab === 'Pip' ? '핍 카드' : '궁정'}
                                    </button>
                                ))}
                            </div>
                            <button onClick={resetAll} className="p-1.5 bg-red-50 text-red-500 rounded-lg active:bg-red-100 transition shadow-sm" title="초기화"><Icon name="RefreshCw" size={16} /></button>
                        </div>
                        <div className="max-w-7xl mx-auto mt-3 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                            {activeTab === 'Major' ? (
                                <div className="flex gap-2 items-center bg-slate-50 p-1 rounded-full">
                                    <button onClick={() => setMajorMode('All')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'All' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>전체</button>
                                    <button onClick={() => setMajorMode('Climax21')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Climax21' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>21번 클라이맥스</button>
                                    <button onClick={() => setMajorMode('Pivot11')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Pivot11' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>11번 중심축</button>
                                    <button onClick={() => setMajorMode('Author7x3')} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${majorMode === 'Author7x3' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>7x3 여정</button>
                                </div>
                            ) : (
                                <>
                                    <button onClick={() => setActiveFilter({ type: 'suit', value: 'All' })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.value === 'All' ? 'bg-slate-800 border-slate-800 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>전체</button>
                                    <div className="flex gap-2 items-center border-l pl-2 border-slate-200">
                                        {['Wands', 'Cups', 'Swords', 'Pentacles'].map(suit => (
                                            <button key={suit} onClick={() => setActiveFilter({ type: 'suit', value: suit })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition flex items-center gap-1.5 ${activeFilter.type === 'suit' && activeFilter.value === suit ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>
                                                <span className={`w-1.5 h-1.5 rounded-full ${suit === 'Wands' ? 'bg-orange-400' : suit === 'Cups' ? 'bg-blue-400' : suit === 'Swords' ? 'bg-slate-400' : 'bg-green-400'}`}></span>
                                                {suit === 'Wands' ? '완드' : suit === 'Cups' ? '컵' : suit === 'Swords' ? '소드' : '동전'}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2 items-center border-l pl-2 border-slate-200 overflow-x-auto no-scrollbar">
                                        {activeTab === 'Pip' ? ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'].map((rank, i) => (
                                            <button key={rank} onClick={() => setActiveFilter({ type: 'rank', value: rank })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.type === 'rank' && activeFilter.value === rank ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>{i === 0 ? 'Ace' : i + 1}</button>
                                        )) : ['Page', 'Knight', 'Queen', 'King'].map(rank => (
                                            <button key={rank} onClick={() => setActiveFilter({ type: 'rank', value: rank })} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold border transition ${activeFilter.type === 'rank' && activeFilter.value === rank ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-500 border-slate-200'}`}>{rank === 'Page' ? '시종' : rank === 'Knight' ? '기사' : rank === 'Queen' ? '여왕' : '왕'}</button>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 p-4 pb-20 overflow-y-auto">
                        <div className={activeTab === 'Major' ? "" : gridClasses}>
                            {activeTab === 'Major' ? renderMajorTabContent() : (
                                displayCards.map(card => (
                                    <div key={card.id} className={(isFourCardMode || isTenCardSuitMode) ? "flex flex-col h-full animate-in" : "h-full animate-in"}>
                                        <TarotCard card={card} customClass={(isFourCardMode || isTenCardSuitMode) ? "flex-1" : ""} />
                                        {(isFourCardMode || isTenCardSuitMode) && (
                                            <div className={`mt-2 p-2 rank-meaning-badge rounded-xl text-[8px] sm:text-[10px] font-black text-center leading-tight line-clamp-2 ${isTenCardSuitMode ? 'opacity-80' : ''}`}>
                                                {activeTab === 'Pip' ? (isTenCardSuitMode ? `${card.rank} 단계` : card.numSymbol) : card.element}
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    </main>

                    {zoomedCard && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center z-50 p-4" onClick={closeDetail}>
                            <div className="relative flex flex-col md:flex-row bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden animate-in" onClick={e => e.stopPropagation()}>
                                <div 
                                    className="md:w-1/2 flex items-center justify-center border-b md:border-b-0 md:border-r p-4 bg-slate-50 relative group cursor-pointer touch-none select-none"
                                    onPointerDown={handlePointerDown}
                                    onPointerMove={handlePointerMove}
                                    onPointerUp={(e) => handlePointerUp(e, () => setIsFullScreen(true))}
                                    onPointerCancel={() => { setPointerStartX(null); setPointerCurrentX(null); }}
                                    title="이미지 크게 보기 (좌우로 밀어 넘기기)"
                                >
                                    {/* 이전 화살표 버튼 */}
                                    <button 
                                        onPointerDown={(e) => e.stopPropagation()} 
                                        onClick={(e) => handleNavBtnClick('prev', e)} 
                                        className="absolute left-2 p-2 bg-white/50 hover:bg-white rounded-full shadow-md text-slate-800 transition-colors z-10 md:opacity-0 group-hover:opacity-100"
                                    ><Icon name="ChevronLeft" size={24} /></button>

                                    <img 
                                        src={`${IMG_BASE}${zoomedCard.img}`} 
                                        alt={zoomedCard.name} 
                                        className="max-h-[45vh] md:max-h-full w-full object-contain rounded-xl shadow-lg pointer-events-none" 
                                        onError={(e) => { e.target.src = "https://via.placeholder.com/400x660?text=Card+Image"; }} 
                                    />
                                    <div className="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors flex items-center justify-center pointer-events-none md:rounded-l-3xl">
                                        <div className="bg-slate-900/60 backdrop-blur-sm text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0 shadow-lg">
                                            <Icon name="ZoomIn" size={24} />
                                        </div>
                                    </div>

                                    {/* 다음 화살표 버튼 */}
                                    <button 
                                        onPointerDown={(e) => e.stopPropagation()} 
                                        onClick={(e) => handleNavBtnClick('next', e)} 
                                        className="absolute right-2 p-2 bg-white/50 hover:bg-white rounded-full shadow-md text-slate-800 transition-colors z-10 md:opacity-0 group-hover:opacity-100"
                                    ><Icon name="ChevronRight" size={24} /></button>
                                </div>
                                <div className="md:w-1/2 p-6 sm:p-8 flex flex-col justify-between overflow-y-auto">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-indigo-100 text-indigo-700">{zoomedCard.type}</span>
                                            <button onClick={closeDetail} className="p-1 hover:bg-slate-100 rounded-full transition text-slate-400"><Icon name="X" size={24} /></button>
                                        </div>
                                        <h2 className="text-3xl sm:text-4xl font-black tracking-tighter mb-6 text-slate-800">{zoomedCard.name}</h2>
                                        <div className="space-y-4">
                                            {zoomedCard.type === 'Court' ? (
                                                <section className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                    <div className="text-slate-500 font-black text-[10px] uppercase mb-1">핵심 통찰</div>
                                                    <p className="text-slate-800 text-base sm:text-lg font-bold leading-relaxed">{zoomedCard.desc}</p>
                                                </section>
                                            ) : (
                                                <>
                                                    <section className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                        <div className="text-slate-500 font-black text-[10px] uppercase mb-1">핵심 상징</div>
                                                        <p className="text-slate-800 text-base sm:text-lg font-bold leading-relaxed">{zoomedCard.desc}</p>
                                                    </section>

                                                    <section className="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
                                                        <div className="text-indigo-600 font-black text-[10px] uppercase mb-1">상징 통찰</div>
                                                        <p className="text-indigo-900 text-xs sm:text-sm font-medium leading-relaxed">{zoomedCard.guide}</p>
                                                    </section>
                                                </>
                                            )}
                                            
                                            {/* 세부 상징 표시부 (데이터가 있을 때만 렌더링) */}
                                            {zoomedCard.details && zoomedCard.details.length > 0 && (
                                                <section className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                    <div className="text-slate-500 font-black text-[10px] uppercase mb-2">세부 상징과 통찰</div>
                                                    <ul className="space-y-2">
                                                        {zoomedCard.details.map((detail, idx) => (
                                                            <li key={idx} className="flex items-start gap-2">
                                                                <span className="text-indigo-400 mt-0.5">•</span>
                                                                <span 
                                                                    className="text-slate-700 text-xs sm:text-sm font-medium leading-relaxed" 
                                                                    dangerouslySetInnerHTML={{__html: detail.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}}
                                                                ></span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </section>
                                            )}
                                        </div>
                                    </div>
                                    <div className="mt-6 pt-4 border-t border-slate-100 text-[9px] font-bold text-slate-400 italic text-center uppercase tracking-widest">
                                        RWS Master Study Guide
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isFullScreen && zoomedCard && (
                        <div 
                            className="fixed inset-0 z-[100] bg-black flex items-center justify-center animate-in fade-in duration-200 cursor-pointer touch-none select-none group" 
                            onPointerDown={handlePointerDown}
                            onPointerMove={handlePointerMove}
                            onPointerUp={(e) => handlePointerUp(e, () => setIsFullScreen(false))}
                            onPointerCancel={() => { setPointerStartX(null); setPointerCurrentX(null); }}
                            title="화면을 터치하면 원래대로 돌아갑니다 (좌우로 밀어 넘기기)"
                        >
                            <button 
                                onPointerDown={(e) => e.stopPropagation()} 
                                onClick={(e) => handleNavBtnClick('prev', e)} 
                                className="absolute left-4 p-4 bg-white/10 hover:bg-white/30 rounded-full text-white transition-colors z-10 opacity-50 hover:opacity-100 md:opacity-0 group-hover:opacity-100"
                            ><Icon name="ChevronLeft" size={32} /></button>

                            <div className="w-full h-full flex items-center justify-center">
                                <img 
                                    src={`${IMG_BASE}${zoomedCard.img}`} 
                                    alt={zoomedCard.name} 
                                    className="max-w-full max-h-full object-contain pointer-events-none" 
                                    onError={(e) => { e.target.src = "https://via.placeholder.com/400x660?text=Card+Image"; }} 
                                />
                            </div>

                            <button 
                                onPointerDown={(e) => e.stopPropagation()} 
                                onClick={(e) => handleNavBtnClick('next', e)} 
                                className="absolute right-4 p-4 bg-white/10 hover:bg-white/30 rounded-full text-white transition-colors z-10 opacity-50 hover:opacity-100 md:opacity-0 group-hover:opacity-100"
                            ><Icon name="ChevronRight" size={32} /></button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
