            { id: 65, name: "결합", type: "minor", group: "천칭자리", combo: "천칭자리 + 사수자리", insight: "온전한 결합, 합일, 믿음", guide: "진정한 해답을 찾는 결합의 시기입니다." },

            { id: 78, name: "성배의 질문", type: "minor", group: "물병자리", combo: "물병자리 + 물고기자리", insight: "궁극의 탐구, 삶의 의미", guide: "본질적인 질문을 던지세요." }
        ];

        const App = () => {
            const [filter, setFilter] = useState('all');

            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCard, setSelectedCard] = useState(null);

            const filteredCards = useMemo(() => {
                return INITIAL_CARDS.filter(card => {
                    const matchesFilter = filter === 'all' || card.type === filter;
                    const matchesMinorZodiac = filter !== 'minor' || minorZodiac === 'all' || card.group === minorZodiac;
                    const matchesSearch = card.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          card.combo.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          card.id.toString() === searchTerm;
                    return matchesFilter && matchesMinorZodiac && matchesSearch;
                });
            }, [filter, minorZodiac, searchTerm]);

                switch(type) {
                    case 'major': return '메이저 (Pure Archetypes)';
                    case 'moon': return '달 카드 (Cancer Combination)';
                    case 'sun': return '태양 카드 (Leo Combination)';
                    case 'minor': return minorZodiac === 'all' ? '마이너 전체' : `마이너 - ${minorZodiac} 조합`;
                    default: return '전체 심볼론 마스터 보드';
                }
            };

            const gridColsClass = useMemo(() => {
                if (filter === 'major' || filter === 'moon') return "grid-cols-2 sm:grid-cols-3 md:grid-cols-6";
                if (filter === 'sun') return "grid-cols-2 sm:grid-cols-3 md:grid-cols-5";
                if (filter === 'minor' && minorZodiac !== 'all') {
                    // 마이너 세부 그룹은 보통 9장 이하이므로 5~6열이 적당
                    return "grid-cols-2 sm:grid-cols-3 md:grid-cols-5";
                }
                return "grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8";
            }, [filter, minorZodiac]);

            const zodiacGroups = ["양자리", "황소자리", "쌍둥이자리", "처녀자리", "천칭자리", "전갈자리", "사수자리", "염소자리", "물병자리"];

            return (

                            <div className="flex justify-between items-center">
                                <h1 className="text-xl font-bold bg-gradient-to-r from-amber-400 via-orange-400 to-red-400 bg-clip-text text-transparent tracking-tight text-shadow-lg">

                                <div className="text-[10px] bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-amber-500 font-mono font-bold">

                                            </section>

                                            <section className="animate-in fade-in slide-in-from-bottom-4 duration-700 bg-indigo-500/5 border border-indigo-500/10 p-8 rounded-[2rem] relative overflow-hidden shadow-inner group">

                            <span className="text-[10px] font-black">MAJOR</span>
                        </button>
                        <button onClick={() => setFilter('moon')} className={`flex flex-col items-center gap-1.5 transition-colors ${filter === 'moon' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <IconMoon size={24} />
                            <span className="text-[10px] font-black">MOON</span>
                        </button>
                        <button onClick={() => setFilter('sun')} className={`flex flex-col items-center gap-1.5 transition-colors ${filter === 'sun' ? 'text-amber-500' : 'text-slate-500'}`}>
                            <IconSun size={24} />
                            <span className="text-[10px] font-black">SUN</span>
                        </button>
                    </nav>
                </div>
            );
        };

        // --- Grid Card Component ---
        const CardItem = ({ card, onClick }) => (
            <div 
                onClick={() => onClick(card)}
                className="bg-slate-900/60 rounded-2xl overflow-hidden border border-slate-800 hover:border-amber-500/50 transition-all cursor-pointer group active:scale-95 card-glow backdrop-blur-sm shadow-xl flex flex-col h-full"
            >
                <div className="relative aspect-card bg-slate-950 overflow-hidden flex-shrink-0">
                    <SymbolonImage cardId={card.id} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000 ease-out" />
                    <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80"></div>
                    <div className="absolute top-3 left-3 bg-slate-900/90 backdrop-blur-md text-amber-500 text-[10px] font-black px-2.5 py-1 rounded-lg border border-amber-500/30 shadow-2xl">
                        {card.id}
                    </div>
                    <div className="absolute bottom-3 left-3 right-3">
                        <p className="text-[9px] text-slate-300 font-bold truncate drop-shadow-md tracking-tight">{card.combo}</p>
                    </div>
                </div>
                <div className="p-3.5 text-center bg-slate-900/40 flex-grow flex items-center justify-center border-t border-slate-800/50">
                    <h3 className="text-[11px] font-black text-slate-100 truncate group-hover:text-amber-400 transition-colors leading-tight tracking-tighter">
                        {card.name}
                    </h3>
                </div>
            </div>
        );

        // --- Image Handler Component ---
        const SymbolonImage = ({ cardId, className, loading = "lazy" }) => {
            const fileName = `symbolon (${cardId})`;
            const primarySrc = `images/${fileName}.avif`;
            const secondarySrc = `images/${fileName}.AVIF`;
            const jpgSrc = `images/${fileName}.jpg`;

            return (
                <img 
                    src={primarySrc}
                    alt={`Symbolon Card ${cardId}`}
                    className={className}
                    loading={loading}
                    onError={(e) => {
                        if (e.target.src.includes('.avif')) {
                            e.target.src = secondarySrc;
                        } else if (e.target.src.includes('.AVIF')) {
                            e.target.src = jpgSrc;
                        } else {
                            e.target.onerror = null;
                            e.target.src = `https://via.placeholder.com/200x320/020617/1e293b?text=${cardId}`;
                        }
                    }}
                />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
