<!DOCTYPE html>

            serif: ['Cinzel', 'serif'],
            sans: ['Noto Sans KR', 'sans-serif'],

              dark: '#070a10',

      background: #232d3f;

      {

        andyRule: "앤디의 9장 라인 핵심은 '원근 거리법(Method of Distance)'입니다. 시그니피케이터(5번 신사) 바로 옆의 4번(기수)과 6번(반지)이 가장 직접적인 현실적 영향력을 행사하며, 가장 먼 1번과 9번은 근본 배경과 최종 목적지입니다.",
        syntax: "<strong>인접 핵심 [4 + 5 + 6]:</strong> 기수 + 신사 + 반지 = 신사가 직접 약속이나 계약을 체결하기 위해 발 빠르게 움직임.<br><strong>외곽 미러링 [1 ⟷ 9]:</strong> 배 + 열쇠 = 원거리 이동이나 사업의 성공적 매듭.<br><strong>[2 ⟷ 8]:</strong> 편지 + 태양 = 성공적인 서면 통보.<br><strong>[3 ⟷ 7]:</strong> 집 + 하트 = 가정 내의 깊은 애정.<br><strong>[4 ⟷ 6]:</strong> 기수 + 반지 = 신속한 계약 체결.",
        studyTip: "9장의 카드가 한눈에 들어오도록 설계되었습니다. 각 미러링 버튼을 눌러 양 날개의 대칭 구도를 직접 비교해 보세요.",
        mirrors: [[0, 8], [1, 7], [2, 6], [3, 5]]
      }
    ];

    const DEFAULT_BASE = "https://johnnydaman.github.io/Tarot/Lenormand36cards/";
    const State = {
      stepIndex: 0,
      activeMirror: null,
      githubBase: localStorage.getItem('andy_github_base') || DEFAULT_BASE,
      confirmedPrefix: localStorage.getItem('andy_confirmed_prefix') || null
    };

    const UI = {
      stepNavContainer: document.getElementById('stepNavContainer'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      stepIndexTag: document.getElementById('stepIndexTag'),
      stepTitle: document.getElementById('stepTitle'),
      stepSubtitle: document.getElementById('stepSubtitle'),
      mirrorToolbar: document.getElementById('mirrorToolbar'),
      cardsRowContainer: document.getElementById('cardsRowContainer'),
      flowSummaryBar: document.getElementById('flowSummaryBar'),
      andyRuleBox: document.getElementById('andyRuleBox'),
      syntaxBox: document.getElementById('syntaxBox'),
      studyTipBox: document.getElementById('studyTipBox'),
      arcsSvg: document.getElementById('arcsSvg'),
      repoStatusBadge: document.getElementById('repoStatusBadge'),
      repoStatusDot: document.getElementById('repoStatusDot'),
      repoStatusText: document.getElementById('repoStatusText'),
      toggleImgConfigBtn: document.getElementById('toggleImgConfigBtn'),
      imgConfigModal: document.getElementById('imgConfigModal'),
      closeConfigModalBtn: document.getElementById('closeConfigModalBtn'),
      customBaseInput: document.getElementById('customBaseInput'),
      resetDefaultBtn: document.getElementById('resetDefaultBtn'),
      saveConfigBtn: document.getElementById('saveConfigBtn'),
      toast: document.getElementById('toast')
    };

    function showToast(msg) {
      UI.toast.innerText = msg;
      UI.toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        UI.toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    /* Build candidate image URLs for any card */
    function getCardCandidates(cardId) {
      const id = cardId;
      let base = State.githubBase.trim();
      if (!base.endsWith('/')) base += '/';

      const candidates = [];

      // 1. Exact confirmed filename pattern: 'c (1).jpg' to 'c (36).jpg'
      const exactEncoded = `c%20(${id}).jpg`;
      const exactRaw = `c (${id}).jpg`;

      candidates.push(`${base}${exactEncoded}`);
      candidates.push(`${base}${exactRaw}`);
      candidates.push(`${base}images/${exactEncoded}`);
      candidates.push(`${base}images/${exactRaw}`);

      // GitHub raw content direct fallback with exact filename
      candidates.push(`https://raw.githubusercontent.com/johnnydaman/Tarot/main/Lenormand36cards/${exactEncoded}`);
      candidates.push(`https://raw.githubusercontent.com/johnnydaman/Tarot/master/Lenormand36cards/${exactEncoded}`);
      candidates.push(`https://raw.githubusercontent.com/johnnydaman/Tarot/main/Lenormand36cards/images/${exactEncoded}`);

      // Case variations (.JPG, .png)
      candidates.push(`${base}c%20(${id}).JPG`);
      candidates.push(`${base}c%20(${id}).png`);

      // 2. If we already established a confirmed working prefix, try it
      if (State.confirmedPrefix) {
        candidates.push(`${State.confirmedPrefix}${exactEncoded}`);
        candidates.push(`${State.confirmedPrefix}${id}.png`);
        candidates.push(`${State.confirmedPrefix}${id}.jpg`);
      }

      // 3. Fallback standard patterns
      candidates.push(`${base}${id}.jpg`);
      candidates.push(`${base}${id}.png`);

      return Array.from(new Set(candidates));
    }
    function renderStepNav() {
      UI.stepNavContainer.innerHTML = '';
      ANDY_STUDY_STEPS.forEach((step, idx) => {
        const btn = document.createElement('button');
        const isActive = idx === State.stepIndex;
        btn.className = `px-2.5 py-1 rounded text-xs whitespace-nowrap transition border ${
          isActive 
            ? 'bg-brand-gold text-slate-950 font-bold border-brand-gold shadow' 
            : 'bg-brand-surfaceAlt text-slate-300 border-brand-border hover:border-slate-500'
        }`;
        btn.innerHTML = `${idx + 1}. ${step.name}`;
        btn.onclick = () => {
          State.stepIndex = idx;
          State.activeMirror = null;
          renderCurrentSpread();
        };
        UI.stepNavContainer.appendChild(btn);
      });
    }

    function drawMirrorArcs() {
      UI.arcsSvg.innerHTML = '';
      if (!State.activeMirror) return;

      const [a, b] = State.activeMirror;
      const cardElements = document.querySelectorAll('#cardsRowContainer > div');
      if (!cardElements[a] || !cardElements[b]) return;

      const svgBox = UI.arcsSvg.getBoundingClientRect();
      const r1 = cardElements[a].getBoundingClientRect();
      const r2 = cardElements[b].getBoundingClientRect();

      const p1 = { x: r1.left + r1.width / 2 - svgBox.left, y: r1.top - svgBox.top + 6 };
      const p2 = { x: r2.left + r2.width / 2 - svgBox.left, y: r2.top - svgBox.top + 6 };

      const midX = (p1.x + p2.x) / 2;
      const dist = Math.abs(p2.x - p1.x);
      const curveY = Math.max(6, p1.y - Math.min(60, dist * 0.2));

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${p1.x} ${p1.y} Q ${midX} ${curveY} ${p2.x} ${p2.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#38bdf8');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('stroke-dasharray', '5 3');

      const dot1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot1.setAttribute('cx', p1.x);
      dot1.setAttribute('cy', p1.y);
      dot1.setAttribute('r', '4.5');
      dot1.setAttribute('fill', '#38bdf8');

      const dot2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot2.setAttribute('cx', p2.x);
      dot2.setAttribute('cy', p2.y);
      dot2.setAttribute('r', '4.5');
      dot2.setAttribute('fill', '#38bdf8');

      UI.arcsSvg.appendChild(path);
      UI.arcsSvg.appendChild(dot1);
      UI.arcsSvg.appendChild(dot2);
    }
    function renderCurrentSpread() {
      const step = ANDY_STUDY_STEPS[State.stepIndex];
      renderStepNav();

      UI.stepIndexTag.innerText = `STEP ${State.stepIndex + 1} / ${ANDY_STUDY_STEPS.length}`;
      UI.stepTitle.innerText = step.title;
      UI.stepSubtitle.innerText = step.subtitle;
      UI.andyRuleBox.innerHTML = step.andyRule;
      UI.syntaxBox.innerHTML = step.syntax;
      UI.studyTipBox.innerHTML = step.studyTip;

      // Render Toolbar (Mirror Buttons)
      UI.mirrorToolbar.innerHTML = '';
      if (step.mirrors && step.mirrors.length > 0) {
        const mirrorLabel = document.createElement('span');
        mirrorLabel.className = 'text-[11px] text-slate-400 font-bold mr-1';
        mirrorLabel.innerText = '미러링 대칭:';
        UI.mirrorToolbar.appendChild(mirrorLabel);

        step.mirrors.forEach(pair => {
          const isSelected = State.activeMirror && State.activeMirror[0] === pair[0] && State.activeMirror[1] === pair[1];
          const mBtn = document.createElement('button');
          mBtn.className = `px-2 py-0.5 rounded text-[11px] font-semibold border transition ${
            isSelected 
              ? 'bg-sky-500 text-slate-950 border-sky-400 shadow' 
              : 'bg-brand-surfaceAlt text-sky-300 border-brand-border hover:border-sky-400'
          }`;
          mBtn.innerText = `[${pair[0] + 1} ⟷ ${pair[1] + 1}]`;
          mBtn.onclick = () => {
            State.activeMirror = isSelected ? null : pair;
            renderCurrentSpread();
          };
          UI.mirrorToolbar.appendChild(mBtn);
        });

        const resetBtn = document.createElement('button');
        resetBtn.className = 'px-2 py-0.5 rounded text-[11px] text-slate-400 bg-brand-surfaceAlt border border-brand-border hover:text-white';
        resetBtn.innerText = '전체 보기';
        resetBtn.onclick = () => {
          State.activeMirror = null;
          renderCurrentSpread();
        };
        UI.mirrorToolbar.appendChild(resetBtn);
      }

      // Render Cards in Container (NO horizontal overflow, all fit smoothly)
      UI.cardsRowContainer.innerHTML = '';
      const totalCards = step.cards.length;

      step.cards.forEach((cardId, idx) => {
        const card = LENORMAND_CARDS.find(c => c.id === cardId) || LENORMAND_CARDS[0];
        const roleLabel = step.cardRoles[idx] || `Card ${idx + 1}`;
        const candidates = getCardCandidates(card.id);

        let isDimmed = false;
        let isMirrorActive = false;
        if (State.activeMirror) {
          if (State.activeMirror.includes(idx)) {
            isMirrorActive = true;
          } else {
            isDimmed = true;
          }
        }

        const isCenter = (totalCards === 5 && idx === 2) || (totalCards === 9 && idx === 4);

        const cardWrapper = document.createElement('div');
        cardWrapper.className = `flex-1 min-w-0 max-w-[125px] flex flex-col items-center gap-1 sm:gap-1.5 transition-all duration-200 ${
          isMirrorActive ? 'card-mirror-active' : ''
        } ${isDimmed ? 'card-dimmed' : ''}`;

        cardWrapper.innerHTML = `
          <!-- Slot Role Tag -->
          <div class="w-full text-center px-0.5">
            <span class="inline-block w-full truncate text-[9px] sm:text-xs font-semibold py-0.5 px-1 rounded border ${
              isCenter 
                ? 'bg-amber-500/25 text-amber-300 border-brand-gold ring-1 ring-brand-gold/40' 
                : (card.polarity === 'positive' ? 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40' : (card.polarity === 'negative' ? 'bg-rose-950/60 text-rose-300 border-rose-500/40' : 'bg-slate-800/80 text-slate-300 border-slate-600/40'))
            }">
              ${roleLabel}
            </span>
          </div>

          <!-- Card Graphic Frame -->
          <div class="w-full aspect-[2/3] rounded-lg overflow-hidden border ${
            isCenter ? 'border-brand-gold ring-1 ring-brand-gold shadow-lg' : 'border-brand-border'
          } bg-gradient-to-b from-[#182030] to-[#0b0e17] flex flex-col justify-between relative shadow-md">
            
            <!-- Real Card Image Element with Multi-Fallback Handler -->
            <img 
              id="card-img-${idx}"
              src="${candidates[0]}" 
              alt="${card.nameEn}" 
              data-candidates='${JSON.stringify(candidates)}'
              data-try-index="0"
              class="w-full h-full object-cover rounded absolute inset-0 z-0 transition duration-150"
            />

            <!-- High-Quality Fallback Vector Graphic (Visible if image cannot be loaded) -->
            <div id="card-fallback-${idx}" class="w-full h-full flex flex-col justify-between p-1.5 sm:p-2 relative z-10 hidden bg-gradient-to-b from-[#161d2b] to-[#0a0d15]">
              <div class="flex items-center justify-between">
                <span class="font-serif font-black text-xs sm:text-sm text-brand-gold">#${card.id}</span>
                <span class="font-bold text-[9px] sm:text-xs text-amber-200 bg-black/60 px-1 rounded border border-brand-border">${card.pip}</span>
              </div>
              <div class="text-center my-auto py-1">
                <div class="text-xl sm:text-2xl filter drop-shadow mb-0.5">${card.icon}</div>
                <div class="font-serif text-[10px] sm:text-xs font-bold text-white truncate px-0.5">${card.nameEn}</div>
                <div class="text-[9px] sm:text-[10px] text-amber-200/90 truncate">${card.nameKo.split(' ')[0]}</div>
              </div>
              <div class="text-center text-[9px] font-semibold ${
                card.polarity === 'positive' ? 'text-emerald-400' : (card.polarity === 'negative' ? 'text-rose-400' : 'text-slate-400')
              }">
                ${card.polarity.toUpperCase()}
              </div>
            </div>
          </div>

          <!-- Position Index Indicator -->
          <span class="text-[9px] sm:text-[10px] font-mono text-slate-400">[${idx + 1}]</span>
        `;

        UI.cardsRowContainer.appendChild(cardWrapper);

        // Bind image load events
        const imgEl = cardWrapper.querySelector(`#card-img-${idx}`);
        const fallbackEl = cardWrapper.querySelector(`#card-fallback-${idx}`);

        imgEl.onload = function() {
          fallbackEl.classList.add('hidden');
          imgEl.classList.remove('hidden');

          // Update Status Badge
          UI.repoStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          UI.repoStatusText.innerText = '이미지 정상 연동됨';

          // Extract working prefix
          const currentSrc = imgEl.src;
          const match = currentSrc.match(/^(.*\/)(\d+)\.(png|jpg|jpeg|webp)$/i);
          if (match && !State.confirmedPrefix) {
            State.confirmedPrefix = match[1];
            localStorage.setItem('andy_confirmed_prefix', match[1]);
          }
        };

        imgEl.onerror = function() {
          let tryIdx = parseInt(imgEl.getAttribute('data-try-index') || '0', 10);
          tryIdx++;
          if (tryIdx < candidates.length) {
            imgEl.setAttribute('data-try-index', tryIdx);
            imgEl.src = candidates[tryIdx];
          } else {
            // All candidates exhausted -> show vector fallback
            imgEl.classList.add('hidden');
            fallbackEl.classList.remove('hidden');
          }
        };
      });

      // Bottom flow summary
      UI.flowSummaryBar.innerHTML = `
        <div class="flex items-center gap-1.5 overflow-x-auto">
          <span class="font-bold text-brand-gold shrink-0">카드 순서:</span>
          <span>${step.cards.map(id => {
            const c = LENORMAND_CARDS.find(x => x.id === id);
            return `<span class="font-semibold text-white">${c.nameKo.split(' ')[0]}</span>`;
          }).join(' <span class="text-amber-400">➔</span> ')}</span>
        </div>
        <div class="text-slate-400 text-[11px] shrink-0">
          ※ 9장의 카드가 화면 너비에 맞춰 100% 자동 스케일링됩니다.
        </div>
      `;

      requestAnimationFrame(() => {
        drawMirrorArcs();
      });
    }
    function init() {
      // Step Navigation Buttons
      UI.prevBtn.onclick = () => {
        if (State.stepIndex > 0) {
          State.stepIndex--;
          State.activeMirror = null;
          renderCurrentSpread();
        } else {
          showToast('첫 번째 예시 스프레드입니다.');
        }
      };

      UI.nextBtn.onclick = () => {
        if (State.stepIndex < ANDY_STUDY_STEPS.length - 1) {
          State.stepIndex++;
          State.activeMirror = null;
          renderCurrentSpread();
        } else {
          showToast('마지막 예시 스프레드입니다.');
        }
      };

      // Modal Triggers
      UI.toggleImgConfigBtn.onclick = () => {
        UI.customBaseInput.value = State.githubBase;
        UI.imgConfigModal.classList.remove('hidden');
      };
      UI.closeConfigModalBtn.onclick = () => {
        UI.imgConfigModal.classList.add('hidden');
      };
      UI.resetDefaultBtn.onclick = () => {
        State.githubBase = DEFAULT_BASE;
        State.confirmedPrefix = null;
        localStorage.removeItem('andy_confirmed_prefix');
        localStorage.setItem('andy_github_base', DEFAULT_BASE);
        UI.customBaseInput.value = DEFAULT_BASE;
        renderCurrentSpread();
        UI.imgConfigModal.classList.add('hidden');
        showToast('기본 주소로 재설정되었습니다.');
      };
      UI.saveConfigBtn.onclick = () => {
        const val = UI.customBaseInput.value.trim();
        if (val) {
          State.githubBase = val;
          State.confirmedPrefix = null;
          localStorage.removeItem('andy_confirmed_prefix');
          localStorage.setItem('andy_github_base', val);
          renderCurrentSpread();
          UI.imgConfigModal.classList.add('hidden');
          showToast('설정된 주소로 이미지를 다시 불러옵니다.');
        }
      };

      // Keyboard arrow shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') UI.prevBtn.click();
        else if (e.key === 'ArrowRight') UI.nextBtn.click();
      });

      // Window resize re-draws mirror arcs
      window.addEventListener('resize', () => {
        drawMirrorArcs();
      });

      renderCurrentSpread();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
