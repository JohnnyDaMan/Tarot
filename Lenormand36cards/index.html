<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lenormand Modern Tableau Visual Study Board</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pretendard Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05); }
    .card-shadow-lg { box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08); }
    .glow-amber { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
    .glow-indigo { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    .glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
    @keyframes pulseArrow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-up { animation: pulseArrow 1.8s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 36 Cards Grand Tableau Data (Exact arrangement requested by user)
    const SPREAD_DATA = [
      // Row 1
      { slot: 1, r: 1, c: 1, num: 26, name: '책', eng: 'Book', icon: 'book-open', tag: 'corner' },
      { slot: 2, r: 1, c: 2, num: 4, name: '집', eng: 'House', icon: 'home' },
      { slot: 3, r: 1, c: 3, num: 22, name: '길', eng: 'Paths', icon: 'git-fork' },
      { slot: 4, r: 1, c: 4, num: 19, name: '탑', eng: 'Tower', icon: 'building-2' },
      { slot: 5, r: 1, c: 5, num: 25, name: '반지', eng: 'Ring', icon: 'circle-dot' },
      { slot: 6, r: 1, c: 6, num: 33, name: '열쇠', eng: 'Key', icon: 'key' },
      { slot: 7, r: 1, c: 7, num: 18, name: '개', eng: 'Dog', icon: 'dog' },
      { slot: 8, r: 1, c: 8, num: 32, name: '달', eng: 'Moon', icon: 'moon' },
      { slot: 9, r: 1, c: 9, num: 31, name: '태양', eng: 'Sun', icon: 'sun', tag: 'corner' },

      // Row 2
      { slot: 10, r: 2, c: 1, num: 15, name: '곰', eng: 'Bear', icon: 'shield' },
      { slot: 11, r: 2, c: 2, num: 10, name: '낫', eng: 'Scythe', icon: 'scissors' },
      { slot: 12, r: 2, c: 3, num: 7, name: '뱀', eng: 'Snake', icon: 'activity' },
      { slot: 13, r: 2, c: 4, num: 13, name: '아이', eng: 'Child', icon: 'baby' },
      { slot: 14, r: 2, c: 5, num: 24, name: '하트', eng: 'Heart', icon: 'heart' },
      { slot: 15, r: 2, c: 6, num: 34, name: '물고기', eng: 'Fish', icon: 'coins' },
      { slot: 16, r: 2, c: 7, num: 5, name: '나무', eng: 'Tree', icon: 'trees' },
      { slot: 17, r: 2, c: 8, num: 30, name: '백합', eng: 'Lily', icon: 'flower-2' },
      { slot: 18, r: 2, c: 9, num: 16, name: '별', eng: 'Stars', icon: 'sparkles' },

      // Row 3
      { slot: 19, r: 3, c: 1, num: 6, name: '구름', eng: 'Clouds', icon: 'cloud-rain' },
      { slot: 20, r: 3, c: 2, num: 28, name: '신사/남자', eng: 'Lord', icon: 'user', keyPerson: 'lord' },
      { slot: 21, r: 3, c: 3, num: 11, name: '채찍', eng: 'Whip/Rod', icon: 'zap' },
      { slot: 22, r: 3, c: 4, num: 12, name: '새', eng: 'Birds', icon: 'twitter' },
      { slot: 23, r: 3, c: 5, num: 2, name: '클로버', eng: 'Clover', icon: 'clover' },
      { slot: 24, r: 3, c: 6, num: 29, name: '숙녀/여자', eng: 'Lady', icon: 'user-check', keyPerson: 'lady', tag: 'sig' },
      { slot: 25, r: 3, c: 7, num: 20, name: '정원', eng: 'Garden', icon: 'trees' },
      { slot: 26, r: 3, c: 8, num: 1, name: '기수', eng: 'Cavalier', icon: 'send' },
      { slot: 27, r: 3, c: 9, num: 9, name: '꽃다발', eng: 'Bouquet', icon: 'gift' },

      // Row 4
      { slot: 28, r: 4, c: 1, num: 14, name: '여우', eng: 'Fox', icon: 'eye', tag: 'corner' },
      { slot: 29, r: 4, c: 2, num: 36, name: '십자가', eng: 'Cross', icon: 'plus-square' },
      { slot: 30, r: 4, c: 3, num: 23, name: '쥐', eng: 'Mice', icon: 'bug' },
      { slot: 31, r: 4, c: 4, num: 8, name: '관', eng: 'Coffin', icon: 'box' },
      { slot: 32, r: 4, c: 5, num: 21, name: '산', eng: 'Mountain', icon: 'mountain' },
      { slot: 33, r: 4, c: 6, num: 3, name: '배', eng: 'Ship', icon: 'compass' },
      { slot: 34, r: 4, c: 7, num: 17, name: '황새', eng: 'Storks', icon: 'bird' },
      { slot: 35, r: 4, c: 8, num: 35, name: '닻', eng: 'Anchor', icon: 'anchor' },
      { slot: 36, r: 4, c: 9, num: 27, name: '편지', eng: 'Letter', icon: 'mail', tag: 'corner' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('steps');
      const [sigCol, setSigCol] = useState(3);
      const [sigRow, setSigRow] = useState(2);
      const [spreadHighlight, setSpreadHighlight] = useState('all');
      const [imageBaseUrl, setImageBaseUrl] = useState('https://johnnydaman.github.io/Tarot/Lenormand36cards/images');
      const [showImageModal, setShowImageModal] = useState(false);
      const [customUrlInput, setCustomUrlInput] = useState('https://johnnydaman.github.io/Tarot/Lenormand36cards/images');
      const [headerCollapsed, setHeaderCollapsed] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 50);
        return () => clearTimeout(timer);
      }, [activeTab, sigCol, sigRow, spreadHighlight, imageBaseUrl, showImageModal, headerCollapsed]);

      // Zone helper for Step 1 & 2
      const getZoneInfo = (r, c) => {
        if (c === sigCol) {
          return { code: 'D', title: 'PRESENT (현재 축)', bg: 'bg-amber-400 text-amber-950 border-amber-500 font-black', shadow: 'glow-amber' };
        }
        if (c < sigCol) {
          if (r === sigRow) return { code: 'B', title: 'Main Past (주요 과거)', bg: 'bg-indigo-600 text-white border-indigo-700', shadow: 'glow-indigo' };
          if (r < sigRow) return { code: 'C', title: 'Recent Past (최근 과거)', bg: 'bg-indigo-100 text-indigo-900 border-indigo-300', shadow: '' };
          return { code: 'A', title: 'Distant Past (가장 먼 과거/원인)', bg: 'bg-slate-200 text-slate-800 border-slate-400', shadow: '' };
        } else {
          if (r === sigRow) return { code: 'F', title: 'Main Future (주요 미래)', bg: 'bg-emerald-600 text-white border-emerald-700', shadow: 'glow-emerald' };
          if (r < sigRow) return { code: 'E', title: 'Near Future (가까운 미래)', bg: 'bg-emerald-100 text-emerald-900 border-emerald-300', shadow: '' };
          return { code: 'G', title: 'Distant Future (먼 미래/안착)', bg: 'bg-teal-200 text-teal-900 border-teal-400', shadow: '' };
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-50">
          {/* Header & Nav */}
          {headerCollapsed ? (
            <header className="bg-white/95 backdrop-blur-md sticky top-0 z-50 px-6 py-2 border-b border-slate-200 shadow-sm flex justify-between items-center transition-all duration-300">
              <div className="flex items-center gap-3">
                <div className="px-2.5 py-1 bg-amber-500 text-slate-950 rounded-xl font-black text-xs flex items-center gap-1.5 shadow-sm">
                  <i data-lucide="compass" className="w-4 h-4"></i> 9×4
                </div>
                <span className="text-xs font-black text-slate-900 hidden sm:inline">MODERN TABLEAU STUDY BOARD</span>
                <span className="text-[11px] font-bold bg-slate-900 text-white px-3 py-1 rounded-lg flex items-center gap-1.5">
                  <i data-lucide="layers" className="w-3.5 h-3.5 text-amber-400"></i>
                  {
                    [
                      { id: 'steps', label: '1. 전체 리딩 8단계 Flow' },
                      { id: 'axes', label: '2. 9x4 시공간 축 & 7구역' },
                      { id: 'past', label: '3. 과거 미시 흐름' },
                      { id: 'present', label: '4. 현재 열 수직 축' },
                      { id: 'future', label: '5. 미래 미시 전개 패턴' },
                      { id: 'spread', label: '6. 9x4 실제 배열 예시 보드' },
                    ].find(t => t.id === activeTab)?.label
                  }
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setHeaderCollapsed(false)}
                  className="px-3 py-1 bg-amber-400 hover:bg-amber-500 text-slate-950 border border-amber-500 rounded-lg font-black text-xs transition-all flex items-center gap-1 shadow-md animate-pulse"
                >
                  <i data-lucide="chevron-down" className="w-4 h-4"></i> 메뉴 펼치기
                </button>
              </div>
            </header>
          ) : (
            <header className="bg-white/95 backdrop-blur-md sticky top-0 z-50 px-8 py-4 border-b border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4 transition-all duration-300">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-amber-500 text-slate-950 rounded-2xl font-black text-2xl tracking-tight shadow-md flex items-center gap-2">
                  <i data-lucide="compass" className="w-7 h-7"></i> 9×4
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">
                      MODERN TABLEAU STUDY BOARD
                    </h1>
                    <span className="text-xs bg-amber-100 text-amber-800 border border-amber-300 px-3 py-1 rounded-full font-bold hidden sm:inline-block">
                      Past · Present · Future
                    </span>
                    <button
                      onClick={() => setHeaderCollapsed(true)}
                      className="ml-2 px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-black flex items-center gap-1 border border-slate-300 transition-all shadow-sm"
                      title="화면을 넓게 쓰기 위해 상단 헤더 접기"
                    >
                      <i data-lucide="chevron-up" className="w-4 h-4 text-amber-600"></i> 헤더 접기
                    </button>
                  </div>
                  <p className="text-xs font-bold text-slate-500 mt-0.5">레노먼드 스터디 리더용 큼직한 시각 프레젠테이션 보드</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <nav className="flex flex-wrap gap-2">
                  {[
                    { id: 'steps', label: '1. 전체 리딩 8단계 Flow', icon: 'list-ordered' },
                    { id: 'axes', label: '2. 9x4 시공간 축 & 7구역', icon: 'grid' },
                    { id: 'past', label: '3. 과거 미시 흐름 (시계방향)', icon: 'rotate-cw' },
                    { id: 'present', label: '4. 현재 열 수직 축 (Bottom-Up)', icon: 'arrow-up-circle' },
                    { id: 'future', label: '5. 미래 미시 전개 패턴', icon: 'arrow-right-circle' },
                    { id: 'spread', label: '6. 9x4 실제 배열 예시 보드', icon: 'layout-grid' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-5 py-3 rounded-2xl font-black text-sm transition-all flex items-center gap-2.5 border ${
                        activeTab === tab.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-lg scale-105'
                          : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100 hover:text-slate-900'
                      }`}
                    >
                      <i data-lucide={tab.icon} className="w-4 h-4"></i>
                      {tab.label}
                    </button>
                  ))}
                </nav>
              </div>
            </header>
          )}

          {/* Modal for Custom Image Path */}
          {}
          {showImageModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-xl w-full border border-slate-200 shadow-2xl space-y-5 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                  <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                    <i data-lucide="link" className="w-5 h-5 text-indigo-600"></i>
                    내 깃허브 이미지 경로 연동
                  </h3>
                  <button
                    onClick={() => setShowImageModal(false)}
                    className="p-1 rounded-xl text-slate-400 hover:bg-slate-100"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-3">
                  <label className="text-xs font-black text-slate-700 block">
                    깃허브 카드 이미지 Base URL / 폴더 주소
                  </label>
                  <input
                    type="text"
                    value={customUrlInput}
                    onChange={(e) => setCustomUrlInput(e.target.value)}
                    placeholder="예: https://johnnydaman.github.io/Tarot/Lenormand36cards/images"
                    className="w-full px-4 py-3 rounded-xl border border-slate-300 font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                  <p className="text-[11px] font-bold text-slate-500 leading-relaxed">
                    💡 **팁**: <code className="bg-slate-100 px-1 py-0.5 rounded text-indigo-600">c (1).jpg</code>, <code className="bg-slate-100 px-1 py-0.5 rounded text-indigo-600">1.jpg</code>, <code className="bg-slate-100 px-1 py-0.5 rounded text-indigo-600">01.jpg</code> 등 모든 파일명 형식을 자동으로 찾아 연동합니다.
                  </p>
                </div>

                {/* Preset Fast Buttons */}
                <div className="space-y-2">
                  <span className="text-[11px] font-bold text-slate-400 block">빠른 선택 / 기본 샘플:</span>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() => setCustomUrlInput('https://johnnydaman.github.io/Tarot/Lenormand36cards/images')}
                      className="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 text-xs font-black"
                    >
                      ★ 내 깃허브 이미지 폴더 주소 적용
                    </button>
                    <button
                      onClick={() => setCustomUrlInput('https://raw.githubusercontent.com/JohnnyDaMan/Tarot/main/Lenormand36cards/images')}
                      className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-bold"
                    >
                      GitHub Raw 주소 방식
                    </button>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    onClick={() => setShowImageModal(false)}
                    className="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200"
                  >
                    취소
                  </button>
                  <button
                    onClick={() => {
                      setImageBaseUrl(customUrlInput.trim());
                      setShowImageModal(false);
                    }}
                    className="px-5 py-2.5 rounded-xl text-xs font-black text-white bg-indigo-600 hover:bg-indigo-700 shadow-md"
                  >
                    경로 적용하기
                  </button>
                </div>
              </div>
            </div>
          )}

          <main className="flex-1 p-8 max-w-[1700px] w-full mx-auto flex flex-col justify-center">

            {/* TAB 1: 8 Steps Flow */}
            {activeTab === 'steps' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 card-shadow flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-black text-slate-900 flex items-center gap-2">
                      <i data-lucide="list-ordered" className="w-6 h-6 text-amber-500"></i>
                      모던 타블로 8단계 리딩 프로세스 (Reading Flow)
                    </h2>
                    <p className="text-xs font-bold text-slate-500 mt-1">질문의 맥락과 시간에 따른 다차원 해석 순서</p>
                  </div>
                  <span className="text-xs font-black bg-slate-100 text-slate-700 px-4 py-2 rounded-xl">Step 1 ~ Step 8 Sequence</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                  {[
                    { step: '01', title: 'DECK CUT', desc: '에너지 힌트', detail: '덱 컷 하단 2장의 조합으로 전체 분위기 파악', icon: 'scissors', color: 'border-slate-300 bg-white' },
                    { step: '02', title: 'FIRST 3 CARDS', desc: '퀘어런트 메시지', detail: '배열 첫 3장이 전달하는 즉각적인 메시지', icon: 'message-square', color: 'border-slate-300 bg-white' },
                    { step: '03', title: '4 CORNERS', desc: '지배적 영향', detail: '4개 모서리가 형성하는 경계 및 주요 주제', icon: 'maximize-2', color: 'border-slate-300 bg-white' },
                    { step: '04', title: 'NEAR / FAR & CLOUDS', desc: '거리 & 구름', detail: '질문자 카드와의 거리 및 구름 카드의 위치', icon: 'cloud-rain', color: 'border-slate-300 bg-white' },
                    { step: '05', title: 'PAST CARDS', desc: '과거 서사', detail: '질문자 좌측 영역: 원인 및 시계방향 미시 분석', icon: 'history', color: 'border-indigo-300 bg-indigo-50/50' },
                    { step: '06', title: 'PRESENT CARDS', desc: '현재 축', detail: '질문자 수직 열: 아래에서 위로 실현 현황 분석', icon: 'clock', color: 'border-amber-300 bg-amber-50/50' },
                    { step: '07', title: 'FUTURE CARDS', desc: '미래 전개', detail: '질문자 우측 영역: 순차 미시 전개 및 마지막 카드', icon: 'sparkles', color: 'border-emerald-300 bg-emerald-50/50' },
                    { step: '08', title: 'THEME CARDS', desc: '테마 심층 분석', detail: '애정(하트/반지/닻) 및 금전(물고기/배) 심층 분석', icon: 'heart', color: 'border-rose-300 bg-rose-50/50' },
                  ].map((s) => (
                    <div key={s.step} className={`p-6 rounded-3xl border-2 ${s.color} card-shadow flex flex-col justify-between h-52 transition-all hover:-translate-y-1`}>
                      <div className="flex justify-between items-start">
                        <span className="text-3xl font-black text-slate-300">{s.step}</span>
                        <div className="p-3 bg-slate-900 text-white rounded-2xl">
                          <i data-lucide={s.icon} className="w-6 h-6"></i>
                        </div>
                      </div>
                      <div>
                        <div className="text-xs font-black text-amber-600 tracking-wider uppercase">{s.desc}</div>
                        <div className="text-xl font-black text-slate-900 mt-0.5">{s.title}</div>
                        <div className="text-xs font-semibold text-slate-500 mt-2">{s.detail}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: 9x4 Grid & 7 Zones */}
            {activeTab === 'axes' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 card-shadow flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-xl font-black text-slate-900 flex items-center gap-2">
                      <i data-lucide="grid" className="w-6 h-6 text-indigo-600"></i>
                      9×4 시공간 축 (Axes) 및 7개 세부 구역 (Zone A~G)
                    </h2>
                    <p className="text-xs font-bold text-slate-500 mt-1">질문자(Lady/Lord) 위치 클릭 시 시공간 축이 동적으로 재배치됩니다.</p>
                  </div>
                  
                  {/* Position Selector */}
                  <div className="flex items-center gap-4 bg-slate-100 p-2 rounded-2xl border border-slate-200">
                    <span className="text-xs font-black text-slate-600 pl-2">질문자 위치 변경:</span>
                    <div className="flex items-center gap-1">
                      <span className="text-xs font-bold text-slate-400">열(Col):</span>
                      {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(c => (
                        <button
                          key={c}
                          onClick={() => setSigCol(c)}
                          className={`w-7 h-7 rounded-lg text-xs font-black transition-all ${sigCol === c ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-200'}`}
                        >
                          {c}
                        </button>
                      ))}

                    <span className="text-xs font-black text-slate-400 mr-2">하이라이트 시각 모드:</span>
                    {[
                      { id: 'all', label: '전체 카드' },
                      { id: 'zones', label: '과거/현재/미래 전체 구분' },
                      { id: 'past', label: '과거(PAST) 집중' },
                      { id: 'present', label: '현재(PRESENT) 집중' },
                      { id: 'future', label: '미래(FUTURE) 집중' },
                      { id: 'persons', label: '질문자(#29) & 파트너(#28)' },
                      { id: 'corners', label: '4개 모서리' },
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setSpreadHighlight(f.id)}
                        className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all border ${
                          spreadHighlight === f.id
                            ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-105'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Zone Map Header */}
                <div className="grid grid-cols-9 gap-3 text-center text-xs font-black uppercase tracking-wider">
                  <div className="col-span-5 text-indigo-700 bg-indigo-50/90 py-2.5 rounded-2xl border border-indigo-200 shadow-sm flex justify-center items-center gap-2">
                    <i data-lucide="history" className="w-4 h-4"></i> PAST (과거 구역: 1 ~ 5열)
                  </div>
                  <div className="col-span-1 text-amber-950 bg-amber-400 py-2.5 rounded-2xl border border-amber-500 shadow-md font-black flex justify-center items-center gap-1 glow-amber">
                    <i data-lucide="clock" className="w-4 h-4"></i> PRESENT (6열)
                  </div>
                  <div className="col-span-3 text-emerald-700 bg-emerald-50/90 py-2.5 rounded-2xl border border-emerald-200 shadow-sm flex justify-center items-center gap-2">
                    FUTURE (미래 구역: 7 ~ 9열) <i data-lucide="sparkles" className="w-4 h-4"></i>
                  </div>
                </div>

                {/* 36 Card Grid Display */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 card-shadow overflow-x-auto">
                  <div className="min-w-[1100px] grid grid-cols-9 gap-3">
                    {SPREAD_DATA.map((card) => {
                      const isLady = card.num === 29;
                      const isLord = card.num === 28;
                      const isCorner = card.tag === 'corner';
                      const isPast = card.c < 6;
                      const isPresent = card.c === 6;
                      const isFuture = card.c > 6;

                      // Visual style decision based on current filter mode
                      let cardStyle = 'bg-slate-50 border-slate-200 text-slate-800';
                      let badgeStyle = 'bg-white/95 text-slate-900';

                      if (spreadHighlight === 'zones') {
                        if (isPast) {
                          cardStyle = 'border-4 border-indigo-600 ring-4 ring-indigo-400/50 shadow-2xl z-10 scale-[1.02]';
                          badgeStyle = 'bg-indigo-600 text-white font-black';
                        }
                        if (isPresent) {
                          cardStyle = 'border-4 border-amber-500 ring-4 ring-amber-400/80 shadow-2xl z-20 scale-105 glow-amber';
                          badgeStyle = 'bg-amber-400 text-slate-950 font-black';
                        }
                        if (isFuture) {
                          cardStyle = 'border-4 border-emerald-500 ring-4 ring-emerald-400/50 shadow-2xl z-10 scale-[1.02]';
                          badgeStyle = 'bg-emerald-600 text-white font-black';
                        }
                      } else if (spreadHighlight === 'past') {
                        if (isPast) {
                          cardStyle = 'border-4 border-indigo-600 ring-4 ring-indigo-400/70 shadow-2xl z-20 scale-105';
                          badgeStyle = 'bg-indigo-600 text-white font-black';
                        } else {
                          cardStyle = 'opacity-25 grayscale-[30%] bg-slate-100 border-slate-200';
                        }
                      } else if (spreadHighlight === 'present') {
                        if (isPresent) {
                          cardStyle = 'border-4 border-amber-500 ring-4 ring-amber-400/90 shadow-2xl z-20 scale-105 glow-amber';
                          badgeStyle = 'bg-amber-400 text-slate-950 font-black';
                        } else {
                          cardStyle = 'opacity-25 grayscale-[30%] bg-slate-100 border-slate-200';
                        }
                      } else if (spreadHighlight === 'future') {
                        if (isFuture) {
                          cardStyle = 'border-4 border-emerald-600 ring-4 ring-emerald-400/70 shadow-2xl z-20 scale-105';
                          badgeStyle = 'bg-emerald-600 text-white font-black';
                        } else {
                          cardStyle = 'opacity-25 grayscale-[30%] bg-slate-100 border-slate-200';
                        }
                      } else if (spreadHighlight === 'persons') {
                        if (isLady) cardStyle = 'border-4 border-amber-500 ring-4 ring-amber-400/80 text-slate-950 scale-105 z-20 font-black shadow-xl glow-amber';
                        else if (isLord) cardStyle = 'border-4 border-indigo-600 ring-4 ring-indigo-400/80 text-white scale-105 z-20 font-black shadow-xl';
                        else cardStyle = 'opacity-20 grayscale bg-slate-100 border-slate-200';
                      } else if (spreadHighlight === 'corners') {
                        if (isCorner) cardStyle = 'border-4 border-indigo-600 ring-4 ring-indigo-400/80 text-white font-black scale-105 shadow-xl glow-indigo';
                        else cardStyle = 'opacity-20 grayscale bg-slate-100 border-slate-200';
                      } else {
                        // Default 'all' view
                        if (isLady) {
                          cardStyle = 'border-4 border-amber-500 ring-4 ring-amber-400/60 text-slate-950 font-black shadow-xl scale-105 z-20 glow-amber';
                          badgeStyle = 'bg-amber-400 text-slate-950 font-black';
                        } else if (isLord) {
                          cardStyle = 'border-4 border-indigo-600 text-white font-black shadow-lg';
                          badgeStyle = 'bg-indigo-600 text-white font-black';
                        } else if (isCorner) {
                          cardStyle = 'border-2 border-slate-800 text-white font-black';
                          badgeStyle = 'bg-slate-800 text-white';
                        }
                      }

                      return (
                        <div
                          key={card.slot}
                          className={`relative h-64 rounded-2xl flex flex-col justify-between transition-all duration-300 border-2 overflow-hidden group shadow-md ${cardStyle}`}
                        >
                          {/* Card Image as Full Container Background (Clean & Bright) */}
                          <div className="absolute inset-0 w-full h-full bg-slate-100 flex items-center justify-center overflow-hidden z-0">
                            <img
                              src={`${imageBaseUrl.replace(/\/$/, '')}/c%20(${card.num}).jpg`}
                              alt={card.name}
                              className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                              onError={(e) => {
                                const baseUrl = imageBaseUrl.replace(/\/$/, '');
                                const num = card.num;
                                const padded = String(num).padStart(2, '0');
                                if (!e.target.dataset.step) {
                                  e.target.dataset.step = "1";
                                  e.target.src = `${baseUrl}/c (${num}).jpg`;
                                } else if (e.target.dataset.step === "1") {
                                  e.target.dataset.step = "2";
                                  e.target.src = `${baseUrl}/${num}.jpg`;
                                } else if (e.target.dataset.step === "2") {
                                  e.target.dataset.step = "3";
                                  e.target.src = `${baseUrl}/${padded}.jpg`;
                                } else if (e.target.dataset.step === "3") {
                                  e.target.dataset.step = "4";
                                  e.target.src = `${baseUrl}/c (${num}).png`;
                                } else if (e.target.dataset.step === "4") {
                                  e.target.dataset.step = "5";
                                  e.target.src = `${baseUrl}/${num}.png`;
                                } else {
                                  e.target.style.display = 'none';
                                  if (e.target.nextElementSibling) {
                                    e.target.nextElementSibling.classList.remove('hidden');
                                  }
                                }
                              }}
                            />
                            <div className="fallback-icon hidden flex-col items-center justify-center my-1 text-slate-800 p-4 text-center">
                              <i data-lucide={card.icon} className="w-10 h-10 mx-auto opacity-90 mb-2"></i>
                              <span className="text-xs font-black">{card.name}</span>
                            </div>
                          </div>

                          {/* Soft bottom gradient just for caption legibility */}
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/10 to-transparent z-10 pointer-events-none"></div>

                          {/* Bottom Card Title & Role Badge */}
                          <div className="relative z-20 p-2 text-center mt-auto">
                            <div className="text-sm font-black tracking-tight leading-tight text-white drop-shadow-md">
                              {card.name}
                            </div>
                            <div className="text-[10px] font-bold text-slate-200 uppercase tracking-wider mb-1 opacity-90">
                              {card.eng}
                            </div>
                            <div className={`text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md shadow-sm inline-block ${badgeStyle}`}>
                              {isLady && '★ LADY (ZARA)'}
                              {isLord && 'LORD (ROBERT)'}
                              {isCorner && 'CORNER'}
                              {!isLady && !isLord && !isCorner && (card.c < 6 ? 'PAST' : card.c === 6 ? 'PRESENT' : 'FUTURE')}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Bottom Legend */}
                <div className="p-5 bg-white rounded-2xl border border-slate-200 card-shadow flex flex-wrap justify-around items-center gap-4 text-xs font-black text-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-md bg-amber-400 border border-amber-500 inline-block"></span>
                    <span>24번 자리 (#29 숙녀 Zara): 시그니피케이터 (R3-C6)</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-md bg-indigo-600 inline-block"></span>
                    <span>20번 자리 (#28 신사 Robert): 과거 인물 (R3-C2)</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-md bg-slate-800 inline-block"></span>
                    <span>4 모서리 (1번 책, 9번 태양, 28번 여우, 36번 편지)</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-4 h-4 rounded-md bg-slate-200 border border-slate-400 inline-block"></span>
                    <span>19번 자리 (#6 구름): 과거 문제 기원</span>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="p-6 text-center text-xs font-bold text-slate-400 border-t border-slate-200 bg-white">
            Lenormand Modern Tableau Study Visual Presentation Board · Created for Study Leaders
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
